<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dost Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 18px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
    }

    .box {
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: none;
      border-radius: 10px;
      background: #075e54;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button.secondary {
      background: #128c7e;
    }

    button.danger {
      background: #d32f2f;
    }

    .hidden {
      display: none !important;
    }

    .user {
      padding: 12px;
      margin: 7px 0;
      background: #f5f5f5;
      border-radius: 10px;
      cursor: pointer;
    }

    .user strong {
      display: block;
    }

    .status {
      font-size: 13px;
      color: #777;
    }

    .chat-header {
      background: #075e54;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .messages {
      height: calc(100vh - 180px);
      overflow-y: auto;
      padding: 15px;
      background: #e5ddd5;
    }

    .message {
      max-width: 80%;
      padding: 10px;
      margin: 7px 0;
      border-radius: 10px;
      clear: both;
    }

    .mine {
      float: right;
      background: #dcf8c6;
    }

    .theirs {
      float: left;
      background: white;
    }

    .send-area {
      display: flex;
      gap: 5px;
      padding: 8px;
      background: white;
    }

    .send-area input {
      margin: 0;
      flex: 1;
    }

    .send-area button {
      width: 80px;
      margin: 0;
    }

    .top-buttons {
      display: flex;
      gap: 5px;
    }

    .top-buttons button {
      font-size: 12px;
      padding: 8px;
    }

    #usersList {
      margin-top: 15px;
    }

    .info {
      background: #eef7f6;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN / REGISTER -->
  <section id="authScreen">

    <div class="header">
      Dost Chat
    </div>

    <div class="box">

      <h2 id="authTitle">رجسٹریشن</h2>

      <input
        type="text"
        id="name"
        placeholder="آپ کا نام"
      >

      <input
        type="email"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button id="registerBtn">
        رجسٹر کریں
      </button>

      <button
        class="secondary"
        id="loginBtn"
      >
        Login
      </button>

      <p id="authMessage"></p>

    </div>

  </section>


  <!-- HOME -->
  <section id="homeScreen" class="hidden">

    <div class="header">
      Dost Chat
    </div>

    <div class="box">

      <div class="info">
        <strong id="myName"></strong>
        <br>
        <span id="myEmail"></span>
      </div>

      <button
        class="danger"
        id="logoutBtn"
      >
        Logout
      </button>

      <h3>👥 Dost Chat Users</h3>

      <div id="usersList">
        Users loading...
      </div>

    </div>

  </section>


  <!-- CHAT -->
  <section id="chatScreen" class="hidden">
