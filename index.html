<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dost Chat</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#e5ddd5}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
.hidden{display:none!important}

.header{
 height:60px;background:#075e54;color:#fff;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 12px
}
.title{font-size:21px;font-weight:bold}
.header button,.chat-head button,.page-head button{
 background:transparent;border:0;color:white;font-size:27px
}

.lang{display:flex;gap:5px;padding:5px;background:#eee}
button{
 border:0;border-radius:7px;padding:11px;
 background:#075e54;color:white;font-size:15px
}
.lang button{flex:1}
.full{width:100%;margin:5px 0}
.blue{background:#1976d2}
.red{background:#d32f2f}
.gray{background:#777}

.box{padding:16px}
input{
 width:100%;padding:13px;margin:6px 0;
 border:1px solid #ccc;border-radius:8px;font-size:16px
}

.menu{
 position:fixed;z-index:1000;
 top:58px;right:max(calc(50% - 250px),5px);
 width:250px;background:white;
 box-shadow:0 5px 25px #0005;border-radius:8px;
 overflow:hidden
}
.menu button{
 width:100%;display:block;text-align:right;
 background:white;color:#222;border-radius:0;
 border-bottom:1px solid #eee
}

.user{
 padding:13px;margin:7px 0;background:#f3f3f3;
 border-radius:9px;cursor:pointer
}
.status{font-size:13px;color:#777}

.search{display:flex;gap:5px}
.search input{flex:1}
.search button{width:85px}

.chat-head{
 height:60px;background:#075e54;color:white;
 display:flex;align-items:center;gap:8px;padding:5px
}
.chat-info{flex:1}
.chat-actions{display:flex;gap:2px}
.chat-actions button{background:transparent;font-size:20px;padding:7px}

.messages{
 height:calc(100vh - 205px);
 min-height:400px;overflow-y:auto;
 padding:12px;background:#e5ddd5
}
.msg{
 max-width:78%;padding:9px 12px;
 margin:6px 0;border-radius:10px;
 word-break:break-word;clear:both
}
.mine{float:right;background:#dcf8c6}
.theirs{float:left;background:white}

.send{
 display:flex;gap:5px;padding:7px;background:#eee
}
.send input{flex:1;margin:0}
.send button{width:75px;margin:0}

.page-head{
 height:60px;background:#075e54;color:white;
 display:flex;align-items:center;gap:10px;padding:5px
}
.page-head button{margin:0}

.option{
 padding:16px;border-bottom:1px solid #eee
}

.modal{
 position:fixed;inset:0;background:#0008;
 display:flex;align-items:center;justify-content:center;
 z-index:3000
}
.modal-box{
 width:92%;max-width:400px;background:white;
 border-radius:12px;padding:18px
}

.call-screen{
 position:fixed;inset:0;background:#111;
 z-index:5000;color:white;
 display:flex;flex-direction:column
}
.call-top{text-align:center;padding:15px}
.videos{position:relative;flex:1;background:#000}
#remoteVideo{
 width:100%;height:100%;object-fit:cover
}
#localVideo{
 position:absolute;right:12px;bottom:12px;
 width:120px;height:170px;
 object-fit:cover;border:2px solid white;
 border-radius:10px;background:#222
}
.call-buttons{
 display:flex;justify-content:center;
 gap:12px;padding:15px
}
.call-buttons button{
 width:55px;height:55px;border-radius:50%;
 font-size:20px
}

.incoming{
 position:fixed;inset:0;
 background:#075e54;color:white;
 z-index:6000;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center
}
.incoming-avatar{
 width:90px;height:90px;border-radius:50%;
 background:#fff;color:#075e54;
 display:flex;align-items:center;justify-content:center;
 font-size:40px;margin:20px
}
.incoming-buttons{display:flex;gap:30px;margin-top:30px}
.incoming-buttons button{
 width:65px;height:65px;border-radius:50%;
 font-size:25px
}

.typing{font-size:12px;color:#ddd}
.toast{
 position:fixed;bottom:20px;left:50%;
 transform:translateX(-50%);
 background:#222;color:#fff;padding:12px 18px;
 border-radius:8px;z-index:9000
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->
<div class="header">
<div class="title">Dost Chat</div>
<button onclick="toggleMenu()">⋮</button>
</div>

<!-- LANGUAGE -->
<div class="lang">
<button onclick="setLanguage('ur')">🇵🇰 اردو</button>
<button onclick="setLanguage('en')">🇬🇧 English</button>
</div>

<!-- MENU -->
<div id="menu" class="menu hidden">
<button onclick="newGroup()">👥 New Group</button>
<button onclick="newCommunity()">👨‍👩‍👧 New Community</button>
<button onclick="broadcast()">📢 Broadcast Lists</button>
<button onclick="linkDevices()">🔗 Link Devices</button>
<button onclick="starred()">⭐ Starred</button>
<button onclick="readAll()">✓ Read All</button>
<button onclick="openSettings()">⚙️ Settings</button>
<button onclick="logout()">🚪 Logout</button>
</div>

<!-- LOGIN -->
<section id="loginPage">

<div class="box">

<h2 id="welcome">خوش آمدید</h2>

<input id="name" placeholder="نام">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<label>
<input id="remember" type="checkbox" style="width:auto" checked>
<span id="rememberText">مجھے یاد رکھیں</span>
</label>

<button class="full" onclick="register()">
نیا اکاؤنٹ بنائیں
</button>

<button class="full blue" onclick="login()">
لاگ اِن
</button>

</div>

</section>

<!-- HOME -->
<section id="homePage" class="hidden">

<div class="box">

<h2 id="chatTitle">چیٹس</h2>

<div id="profile"></div>

<div class="search">
<input id="search" placeholder="Email">
<button onclick="findUser()">تلاش</button>
</div>

<div id="result"></div>

<h3>صارفین</h3>

<div id="users"></div>

</div>

</section>

<!-- CHAT -->
<section id="chatPage" class="hidden">

<div class="chat-head">

<button onclick="backHome()">←</button>

<div class="chat-info">

<strong id="chatName"></strong>

<div id="chatStatus" class="status"></div>

<div id="typing" class="typing"></div>

</div>

<div class="chat-actions">
<button onclick="startVoice()">🎤</button>
<button onclick="startVideo()">📹</button>
</div>

</div>

<div id="messages" class="messages"></div>

<div class="send">

<input id="message" placeholder="پیغام لکھیں...">

<button onclick="sendMessage()">بھیجیں</button>

</div>

</section>

<!-- SETTINGS -->
<section id="settingsPage" class="hidden">

<div class="page-head">

<button onclick="backHome()">←</button>

<strong>Settings</strong>

</div>

<div class="option">👤 Account</div>
<div class="option">🔒 Privacy</div>
<div class="option">📋 Lists</div>
<div class="option">💬 Chats</div>
<div class="option">🔔 Notifications</div>
<div class="option">🎨 Theme</div>
<div class="option">🌐 Language</div>
<div class="option">❓ Help</div>
<div class="option">ℹ️ About</div>

</section>

<!-- GROUP MODAL -->
<div id="groupModal" class="modal hidden">

<div class="modal-box">

<h2>New Group</h2>

<input id="groupName" placeholder="Group Name">

<div id="groupUsers"></div>

<button class="full" onclick="createGroup()">
Create Group
</button>

<button class="full red" onclick="closeGroup()">
Cancel
</button>

</div>

</div>

<!-- INCOMING CALL -->
<div id="incomingCall" class="incoming hidden">

<h2 id="incomingType">Incoming Call</h2>

<div class="incoming-avatar">👤</div>

<h2 id="incomingName"></h2>

<div id="incomingButtons" class="incoming-buttons">

<button class="red" onclick="rejectIncoming()">✕</button>

<button onclick="acceptIncoming()">✓</button>

</div>

</div>

<!-- ACTIVE CALL -->
<div id="callScreen" class="call-screen hidden">

<div class="call-top">

<strong id="callTitle">Call</strong>

<div id="callStatus">Connecting...</div>

</div>

<div class="videos">

<video id="remoteVideo" autoplay playsinline></video>

<video id="localVideo" autoplay muted playsinline></video>

</div>

<div class="call-buttons">

<button onclick="toggleMic()">🎤</button>

<button onclick="toggleCamera()">📹</button>

<button class="red" onclick="endCall()">📞</button>

</div>

</div>

<div id="toast" class="toast hidden"></div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
setPersistence,
browserLocalPersistence,
browserSessionPersistence,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
getDocs,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
getDatabase,
ref,
set,
onValue,
onDisconnect,
remove,
serverTimestamp as dbTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig={

apiKey:
"AIzaSyBvEGBT5yvkcPoziNc3U9rh87IEkOn_7eM",

authDomain:
"dost-chat-a7eec.firebaseapp.com",

projectId:
"dost-chat-a7eec",

storageBucket:
"dost-chat-a7eec.firebasestorage.app",

messagingSenderId:
"760944205758",

appId:
"1:760944205758:web:41d06ed0c34b3f24f8a3ef",

databaseURL:
"https://dost-chat-a7eec-default-rtdb.firebaseio.com/"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);

const rtdb=getDatabase(app);


/* VARIABLES */

let currentUser=null;
let selectedUser=null;

let chatUnsub=null;
let typingTimer=null;

let pc=null;
let localStream=null;

let currentCallId=null;
let incomingCallData=null;
let callDocUnsub=null;
let candidateUnsub=null;


/* WEBRTC */

const rtcConfig={

iceServers:[

{urls:"stun:stun.l.google.com:19302"},

{urls:"stun:stun1.l.google.com:19302"}

]

};


/* LANGUAGE */

let lang=
localStorage.getItem("dostLanguage")||"ur";


window.setLanguage=function(x){

lang=x;

localStorage.setItem(
"dostLanguage",x
);

document.documentElement.dir=
x==="ur"?"rtl":"ltr";

if(x==="ur"){

welcome.textContent="خوش آمدید";

rememberText.textContent=
"مجھے یاد رکھیں";

chatTitle.textContent="چیٹس";

document.querySelector(
"#loginPage button"
).textContent=
"نیا اکاؤنٹ بنائیں";

document.querySelector(
"#loginPage .blue"
).textContent=
"لاگ اِن";

}else{

welcome.textContent="Welcome";

rememberText.textContent=
"Remember Me";

chatTitle.textContent="Chats";

document.querySelector(
"#loginPage button"
).textContent=
"Create Account";

document.querySelector(
"#loginPage .blue"
).textContent=
"Login";

}

};


window.setLanguage(lang);


/* SHOW / HIDE */

function show(id){
document.getElementById(id)
.classList.remove("hidden");
}

function hide(id){
document.getElementById(id)
.classList.add("hidden");
}


/* MENU */

window.toggleMenu=function(){

document.getElementById("menu")
.classList.toggle("hidden");

};


/* REGISTER */

window.register=async function(){

const name=document.getElementById("name")
.value.trim();

const email=document.getElementById("email")
.value.trim();

const password=document.getElementById("password")
.value;

if(!name||!email||!password){

toast("تمام معلومات درج کریں");

return;

}

if(password.length<6){

toast("Password کم از کم 6 characters کا ہونا چاہیے");

return;

}

try{

await setPersistence(
auth,
document.getElementById("remember").checked
?browserLocalPersistence
:browserSessionPersistence
);

const result=
await createUserWithEmailAndPassword(
auth,email,password
);

await setDoc(
doc(db,"users",result.user.uid),
{
uid:result.user.uid,
name:name,
email:email,
createdAt:serverTimestamp()
}
);

toast("Account بن گیا");

}catch(error){

toast(error.message);

}

};


/* LOGIN */

window.login=async function(){

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

if(!email||!password){

toast("Email اور Password درج کریں");

return;

}

try{

await setPersistence(
auth,
document.getElementById("remember").checked
?browserLocalPersistence
:browserSessionPersistence
);

await signInWithEmailAndPassword(
auth,email,password
);

}catch(error){

toast(error.message);

}

};


/* AUTH */

onAuthStateChanged(
auth,
async user=>{

if(!user){

currentUser=null;

hide("homePage");
hide("chatPage");
hide("settingsPage");

show("loginPage");

return;

}

currentUser=user;

hide("loginPage");

show("homePage");

await setupPresence();

loadProfile();

loadUsers();

listenIncomingCalls();

}
);


/* PRESENCE */

async function setupPresence(){

const uid=currentUser.uid;

const statusRef=
ref(rtdb,"status/"+uid);

const connectedRef=
ref(rtdb,".info/connected");

onValue(
connectedRef,
snap=>{

if(snap.val()!==true)return;

onDisconnect(statusRef)
.set({
state:"offline",
lastChanged:dbTimestamp()
});

set(statusRef,{
state:"online",
lastChanged:dbTimestamp()
});

});

}


/* PROFILE */

async function loadProfile(){

const snap=
await getDoc(
doc(db,"users",currentUser.uid)
);

if(!snap.exists())return;

const d=snap.data();

document.getElementById("profile")
.innerHTML=
`
<strong>${safe(d.name)}</strong>
<br>
<small>${safe(d.email)}</small>
`;

}


/* USERS */

function loadUsers(){

onSnapshot(
collection(db,"users"),
snap=>{

const box=
document.getElementById("users");

box.innerHTML="";

snap.forEach(s=>{

if(s.id===currentUser.uid)return;

const d=s.data();

const div=
document.createElement("div");

div.className="user";

div.innerHTML=
`
<strong>${safe(d.name||"User")}</strong>
<div>${safe(d.email||"")}</div>
<div id="status-${s.id}"
class="status">
Checking...
</div>
`;

div.onclick=()=>openChat({

uid:s.id,
name:d.name||"User",
email:d.email||""

});

box.appendChild(div);

listenStatus(s.id);

});

});

}


/* STATUS */

function listenStatus(uid){

onValue(
ref(rtdb,"status/"+uid),
snap=>{

const el=
document.getElementById(
"status-"+uid
);

if(!el)return;

const d=snap.val();

if(d?.state==="online"){

el.textContent=
lang==="ur"
?"🟢 آن لائن"
:"🟢 Online";

}else if(d?.lastChanged){

el.textContent=
(lang==="ur"
?"آخری بار: "
:"Last seen: ")
+
new Date(
d.lastChanged
).toLocaleString();

}else{

el.textContent=
lang==="ur"
?"آف لائن"
:"Offline";

}

});

}


/* SEARCH */

window.findUser=async function(){

const email=
document.getElementById("search")
.value.trim();

if(!email)return;

const q=query(
collection(db,"users"),
where("email","==",email)
);

const snap=await getDocs(q);

const result=
document.getElementById("result");

result.innerHTML="";

if(snap.empty){

result.textContent=
"User نہیں ملا";

return;

}

const s=snap.docs[0];

const d=s.data();

const div=document.createElement("div");

div.className="user";

div.innerHTML=
`
<strong>${safe(d.name)}</strong>
<div>${safe(d.email)}</div>
`;

div.onclick=()=>openChat({

uid:s.id,
name:d.name,
email:d.email

});

result.appendChild(div);

};


/* CHAT ID */

function chatId(){

return [
currentUser.uid,
selectedUser.uid
].sort().join("_");

}


/* OPEN CHAT */

function openChat(user){

selectedUser=user;

hide("homePage");

show("chatPage");

document.getElementById(
"chatName"
).textContent=user.name;

listenChatStatus();

listenMessages();

listenTyping();

}


/* CHAT STATUS */

function listenChatStatus(){

onValue(
ref(
rtdb,
"status/"+selectedUser.uid
),
snap=>{

const d=snap.val();

const el=
document.getElementById(
"chatStatus"
);

if(d?.state==="online"){

el.textContent=
lang==="ur"
?"🟢 آن لائن"
:"🟢 Online";

}else if(d?.lastChanged){

el.textContent=
(lang==="ur"
?"آخری بار: "
:"Last seen: ")
+
new Date(
d.lastChanged
).toLocaleString();

}

});

}


/* MESSAGES */

function listenMessages(){

if(chatUnsub)
chatUnsub();

const q=query(
collection(
db,
"chats",
chatId(),
"messages"
),
orderBy(
"createdAt",
"asc"
)
);

chatUnsub=
onSnapshot(
q,
snap=>{

const box=
document.getElementById(
"messages"
);

box.innerHTML="";

snap.forEach(s=>{

const d=s.data();

const div=
document.createElement("div");

div.className=
"msg "+
(
d.senderId===currentUser.uid
?"mine"
:"theirs"
);

div.textContent=d.text;

box.appendChild(div);

});

box.scrollTop=
box.scrollHeight;

});

}


/* SEND */

window.sendMessage=async function(){

const input=
document.getElementById(
"message"
);

const text=
input.value.trim();

if(!text||!selectedUser)return;

await addDoc(
collection(
db,
"chats",
chatId(),
"messages"
),
{
text:text,
senderId:currentUser.uid,
receiverId:selectedUser.uid,
createdAt:serverTimestamp()
}
);

input.value="";

};


/* TYPING */

document.getElementById(
"message"
).addEventListener(
"input",
()=>{

if(!selectedUser)return;

const typingRef=
ref(
rtdb,
"typing/"
+
chatId()
+
"/"
+
currentUser.uid
);

set(typingRef,true);

clearTimeout(typingTimer);

typingTimer=
setTimeout(
()=>{
remove(typingRef);
},
1200
);

});


function listenTyping(){

onValue(
ref(
rtdb,
"typing/"
+
chatId()
+
"/"
+
selectedUser.uid
),
snap=>{

document.getElementById(
"typing"
).textContent=
snap.val()
?"typing..."
:"";

});

}


/* BACK */

window.backHome=function(){

if(chatUnsub)
chatUnsub();

hide("chatPage");

hide("settingsPage");

show("homePage");

};


/* GROUP */

window.newGroup=function(){

hide("menu");

show("groupModal");

loadGroupUsers();

};


async function loadGroupUsers(){

const box=
document.getElementById(
"groupUsers"
);

box.innerHTML="";

const snap=
await getDocs(
collection(db,"users")
);

snap.forEach(s=>{

if(s.id===currentUser.uid)
return;

const d=s.data();

box.innerHTML+=
`
<label style="display:block;padding:8px">
<input
type="checkbox"
class="groupMember"
value="${s.id}"
style="width:auto">
${safe(d.name)}
</label>
`;

});

}


window.createGroup=async function(){

const name=
document.getElementById(
"groupName"
).value.trim();

const members=[
currentUser.uid
];

document.querySelectorAll(
".groupMember:checked"
).forEach(x=>{
members.push(x.value);
});

if(!name){

toast("Group name لکھیں");

return;

}

if(members.length<2){

toast("کم از کم ایک member منتخب کریں");

return;

}

await addDoc(
collection(db,"groups"),
{
name:name,
members:members,
createdBy:currentUser.uid,
createdAt:serverTimestamp()
}
);

closeGroup();

toast("Group created");

};


window.closeGroup=function(){
hide("groupModal");
};


/* OTHER MENU */

window.newCommunity=function(){
hide("menu");
toast("Community feature");
};

window.broadcast=function(){
hide("menu");
toast("Broadcast Lists");
};

window.linkDevices=function(){
hide("menu");
toast("Link Devices");
};

window.starred=function(){
hide("menu");
toast("Starred Messages");
};

window.readAll=function(){
hide("menu");
toast("All messages read");
};


/* SETTINGS */

window.openSettings=function(){

hide("menu");

hide("homePage");

hide("chatPage");

show("settingsPage");

};


/* =========================
REAL WEBRTC CALLING
========================= */


/* START VOICE */

window.startVoice=function(){

startOutgoingCall(false);

};


/* START VIDEO */

window.startVideo=function(){

startOutgoingCall(true);

};


/* OUTGOING CALL */

async function startOutgoingCall(video){

if(!selectedUser)return;

currentCallId=
crypto.randomUUID();

show("callScreen");

document.getElementById(
"callTitle"
).textContent=
video
?"📹 Video Call"
:"🎤 Voice Call";

document.getElementById(
"callStatus"
).textContent=
"Calling "+selectedUser.name;

try{

localStream=
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:video

});

}catch(error){

toast(
"Microphone/Camera permission required"
);

hide("callScreen");

return;

}

document.getElementById(
"localVideo"
).srcObject=
localStream;

pc=
new RTCPeerConnection(
rtcConfig
);

localStream
.getTracks()
.forEach(track=>{
pc.addTrack(
track,
localStream
);
});

pc.ontrack=event=>{

document.getElementById(
"remoteVideo"
).srcObject=
event.streams[0];

};

const callRef=
doc(
db,
"calls",
currentCallId
);

await setDoc(
callRef,
{

callerId:
currentUser.uid,

callerName:
await getUserName(
currentUser.uid
),

receiverId:
selectedUser.uid,

receiverName:
selectedUser.name,

video:video,

status:"ringing",

createdAt:
serverTimestamp()

}
);

pc.onicecandidate=async event=>{

if(!event.candidate)return;

await addDoc(
collection(
db,
"calls",
currentCallId,
"callerCandidates"
),
event.candidate.toJSON()
);

};

const offer=
await pc.createOffer();

await pc.setLocalDescription(
offer
);

await setDoc(
callRef,
{

offer:{
type:offer.type,
sdp:offer.sdp
}

},
{merge:true}
);

listenCallDocument();

listenRemoteCandidates(
"calleeCandidates"
);

}


/* INCOMING CALL LISTENER */

function listenIncomingCalls(){

const q=query(
collection(db,"calls"),
where(
"receiverId",
"==",
currentUser.uid
),
where(
"status",
"==",
"ringing"
)
);

onSnapshot(
q,
snap=>{

snap.docChanges()
.forEach(change=>{

if(change.type!=="added")
return;

const d=change.doc.data();

incomingCallData={
id:change.doc.id,
...d
};

show("incomingCall");

document.getElementById(
"incomingName"
).textContent=
d.callerName||"Unknown";

document.getElementById(
"incomingType"
).textContent=
d.video
?"📹 Incoming Video Call"
:"🎤 Incoming Voice Call";

});

});

}


/* ACCEPT */

window.acceptIncoming=async function(){

if(!incomingCallData)return;

const call=incomingCallData;

hide("incomingCall");

selectedUser={
uid:call.callerId,
name:call.callerName
};

currentCallId=call.id;

show("callScreen");

document.getElementById(
"callTitle"
).textContent=
call.video
?"📹 Video Call"
:"🎤 Voice Call";

document.getElementById(
"callStatus"
).textContent=
"Connecting...";

try{

localStream=
await navigator.mediaDevices
.getUserMedia({

audio:true,

video:call.video

});

}catch(error){

toast(
"Microphone/Camera permission required"
);

return;

}

document.getElementById(
"localVideo"
).srcObject=
localStream;

pc=
new RTCPeerConnection(
rtcConfig
);

localStream
.getTracks()
.forEach(track=>{
pc.addTrack(
track,
localStream
);
});

pc.ontrack=event=>{

document.getElementById(
"remoteVideo"
).srcObject=
event.streams[0];

document.getElementById(
"callStatus"
).textContent=
"Connected";

};

pc.onicecandidate=async event=>{

if(!event.candidate)return;

await addDoc(
collection(
db,
"calls",
currentCallId,
"calleeCandidates"
),
event.candidate.toJSON()
);

};

const callRef=
doc(
db,
"calls",
currentCallId
);

const snap=
await getDoc(callRef);

const data=snap.data();

await pc.setRemoteDescription(
new RTCSessionDescription(
data.offer
)
);

const answer=
await pc.createAnswer();

await pc.setLocalDescription(
answer
);

await setDoc(
callRef,
{

answer:{
type:answer.type,
sdp:answer.sdp
},

status:"connected"

},
{merge:true}
);

listenRemoteCandidates(
"callerCandidates"
);

};


/* REJECT */

window.rejectIncoming=async function(){

if(!incomingCallData)return;

await setDoc(
doc(
db,
"calls",
incomingCallData.id
),
{
status:"rejected"
},
{merge:true}
);

hide("incomingCall");

incomingCallData=null;

};


/* CALL DOCUMENT */

function listenCallDocument(){

if(callDocUnsub)
callDocUnsub();

callDocUnsub=
onSnapshot(
doc(
db,
"calls",
currentCallId
),
async snap=>{

const d=snap.data();

if(!d)return;

if(d.answer && pc){

try{

await pc.setRemoteDescription(
new RTCSessionDescription(
d.answer
)
);

document.getElementById(
"callStatus"
).textContent=
"Connected";

}catch(e){}

}

if(d.status==="rejected"){

toast("Call rejected");

endCall();

}

if(d.status==="ended"){

endCall();

}

});

}


/* REMOTE ICE */

function listenRemoteCandidates(path){

if(candidateUnsub)
candidateUnsub();

candidateUnsub=
onSnapshot(
collection(
db,
"calls",
currentCallId,
path
),
snap=>{

snap.docChanges()
.forEach(async change=>{

if(change.type!=="added")
return;

if(!pc)return;

try{

await pc.addIceCandidate(
new RTCIceCandidate(
change.doc.data()
)
);

}catch(e){}

});

});

}


/* END CALL */
window.endCall = async function () {

    const callId = currentCallId;

    // پہلے local call ختم کریں
    if (localStream) {
        localStream.getTracks().forEach(track => {
            track.stop();
        });
        localStream = null;
    }

    // WebRTC connection بند کریں
    if (pc) {
        try {
            pc.ontrack = null;
            pc.onicecandidate = null;
            pc.close();
        } catch (e) {}

        pc = null;
    }

    // Firestore listeners بند کریں
    if (callDocUnsub) {
        callDocUnsub();
        callDocUnsub = null;
    }

    if (candidateUnsub) {
        candidateUnsub();
        candidateUnsub = null;
    }

    // Call کو ended کریں
    if (callId) {
        try {
            await setDoc(
                doc(db, "calls", callId),
                {
                    status: "ended",
                    endedBy: currentUser.uid,
                    endedAt: serverTimestamp()
                },
                { merge: true }
            );
        } catch (error) {
            console.error("End call error:", error);
        }
    }

    currentCallId = null;
    incomingCallData = null;

    // Videos صاف کریں
    const localVideo =
        document.getElementById("localVideo");

    const remoteVideo =
        document.getElementById("remoteVideo");

    if (localVideo) {
        localVideo.srcObject = null;
    }

    if (remoteVideo) {
        remoteVideo.srcObject = null;
    }

    // Call screen بند
    hide("callScreen");

    // Incoming screen بھی بند
    hide("incomingCall");

};

/* MIC */

window.toggleMic=function(){

if(!localStream)return;

localStream
.getAudioTracks()
.forEach(track=>{
track.enabled=!track.enabled;
});

};


/* CAMERA */

window.toggleCamera=function(){

if(!localStream)return;

localStream
.getVideoTracks()
.forEach(track=>{
track.enabled=!track.enabled;
});

};


/* USER NAME */

async function getUserName(uid){

const snap=
await getDoc(
doc(db,"users",uid)
);

return snap.exists()
?snap.data().name
:"User";

}


/* LOGOUT */

window.logout=async function(){

await signOut(auth);

};


/* TOAST */

function toast(msg){

const t=
document.getElementById("toast");

t.textContent=msg;

t.classList.remove("hidden");

setTimeout(()=>{
t.classList.add("hidden");
},3000);

}


/* HTML SAFE */

function safe(value){

const div=
document.createElement("div");

div.textContent=value||"";

return div.innerHTML;

}
