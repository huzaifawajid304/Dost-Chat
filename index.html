<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dost Chat</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#e9edef;
}
.app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#fff;
}
.header{
  background:#075e54;
  color:#fff;
  padding:16px;
  text-align:center;
  font-size:24px;
  font-weight:bold;
}
.lang{
  display:flex;
  gap:6px;
  padding:8px;
  background:#f5f5f5;
}
.lang button{
  flex:1;
}
.box{
  padding:18px;
}
input{
  width:100%;
  padding:13px;
  margin:6px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}
button{
  border:0;
  border-radius:9px;
  padding:12px;
  margin:5px 0;
  background:#075e54;
  color:white;
  font-size:15px;
  cursor:pointer;
}
.full{
  width:100%;
}
.green{background:#128c7e}
.red{background:#d32f2f}
.blue{background:#1976d2}
.hidden{display:none!important}

.user{
  padding:13px;
  margin:7px 0;
  background:#f4f4f4;
  border-radius:10px;
  cursor:pointer;
}
.user-name{
  font-weight:bold;
  font-size:17px;
}
.status{
  font-size:13px;
  color:#777;
}

.search{
  display:flex;
  gap:5px;
}
.search input{
  flex:1;
}
.search button{
  width:80px;
}

.chat-head{
  background:#075e54;
  color:white;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.chat-actions{
  display:flex;
  gap:3px;
}
.chat-actions button{
  padding:8px 10px;
  margin:0;
}

.typing{
  font-size:12px;
  color:#d8ffdc;
}

.messages{
  height:calc(100vh - 245px);
  min-height:420px;
  overflow-y:auto;
  padding:12px;
  background:#e5ddd5;
}
.msg{
  max-width:78%;
  padding:9px 12px;
  margin:6px 0;
  border-radius:10px;
  clear:both;
  word-wrap:break-word;
}
.mine{
  float:right;
  background:#dcf8c6;
}
.theirs{
  float:left;
  background:white;
}

.send{
  display:flex;
  gap:5px;
  padding:7px;
}
.send input{
  flex:1;
  margin:0;
}
.send button{
  width:75px;
  margin:0;
}

.call-screen{
  position:fixed;
  inset:0;
  background:#111;
  z-index:1000;
  color:white;
  display:flex;
  flex-direction:column;
}
.remote{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#222;
}
.local{
  position:absolute;
  right:15px;
  top:70px;
  width:120px;
  height:170px;
  object-fit:cover;
  background:#333;
  border:2px solid white;
  border-radius:10px;
}
.call-info{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  text-align:center;
  z-index:3;
}
.call-buttons{
  position:absolute;
  bottom:30px;
  left:0;
  right:0;
  text-align:center;
  z-index:4;
}
.call-buttons button{
  width:65px;
  height:55px;
  border-radius:50%;
  margin:5px;
}
.incoming{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:2000;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}
.incoming-box{
  width:90%;
  max-width:350px;
  padding:25px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">Dost Chat</div>

<div class="lang">
<button onclick="setLang('ur')">اردو</button>
<button onclick="setLang('en')">English</button>
</div>

<!-- AUTH -->
<section id="auth">

<div class="box">

<h2 id="authTitle">رجسٹریشن / Login</h2>

<input id="name" placeholder="آپ کا نام">

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button class="full" onclick="emailRegister()">
رجسٹر کریں
</button>

<button class="green full" onclick="emailLogin()">
Email Login
</button>

<hr>

<input id="phone"
placeholder="+923001234567">

<div id="recaptcha"></div>

<button class="blue full" onclick="sendOTP()">
📱 موبائل نمبر پر OTP بھیجیں
</button>

<input id="otp"
placeholder="OTP درج کریں">

<button class="green full" onclick="verifyOTP()">
OTP Verify کریں
</button>

<div id="authMsg"></div>

</div>

</section>


<!-- HOME -->
<section id="home" class="hidden">

<div class="box">

<h2 id="welcome">خوش آمدید</h2>

<div id="myInfo"></div>

<button class="red full" onclick="logout()">
Logout
</button>

<h3 id="searchTitle">نمبر سے صارف تلاش کریں</h3>

<div class="search">
<input id="searchPhone" placeholder="+923001234567">
<button onclick="searchUser()">Search</button>
</div>

<div id="searchResult"></div>

<h3 id="friendsTitle">Users</h3>

<div id="users"></div>

</div>

</section>


<!-- CHAT -->
<section id="chat" class="hidden">

<div class="chat-head">

<div>
<strong id="chatName"></strong>
<div id="chatStatus"></div>
<div id="typing" class="typing"></div>
</div>

<div class="chat-actions">
<button onclick="startCall(false)">🎤</button>
<button onclick="startCall(true)">📹</button>
<button onclick="closeChat()">↩</button>
</div>

</div>

<div id="messages" class="messages"></div>

<div class="send">
<input id="messageInput" placeholder="پیغام لکھیں...">
<button onclick="sendMessage()">Send</button>
</div>

</section>

</div>


<!-- CALL SCREEN -->
<div id="callScreen" class="call-screen hidden">

<div class="call-info">
<div id="callTitle">Calling...</div>
</div>

<video id="remoteVideo"
class="remote"
autoplay
playsinline></video>

<video id="localVideo"
class="local"
autoplay
muted
playsinline></video>

<div class="call-buttons">

<button onclick="toggleMute()">🎤</button>

<button onclick="toggleCamera()">📹</button>

<button class="red" onclick="endCall()">📞</button>

</div>

</div>


<!-- INCOMING CALL -->
<div id="incoming" class="incoming hidden">

<div class="incoming-box">

<h2>📞</h2>

<h2 id="incomingName">Incoming Call</h2>

<p id="incomingType"></p>

<button class="green full"
onclick="acceptCall()">
Accept
</button>

<button class="red full"
onclick="rejectCall()">
Reject
</button>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signInWithPhoneNumber,
RecaptchaVerifier,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
getDocs,
query,
where,
orderBy,
addDoc,
onSnapshot,
serverTimestamp,
updateDoc,
deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyBvEGBT5yvkcPoziNc3U9rh87IEkOn_7eM",
authDomain:"dost-chat-a7eec.firebaseapp.com",
projectId:"dost-chat-a7eec",
storageBucket:"dost-chat-a7eec.firebasestorage.app",
messagingSenderId:"760944205758",
appId:"1:760944205758:web:41d06ed0c34b3f24f8a3ef"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let me=null;
let selected=null;
let confirmOTP=null;
let unsubscribeMessages=null;
let unsubscribeTyping=null;
let unsubscribeCall=null;

let pc=null;
let localStream=null;
let remoteStream=null;
let currentCallId=null;
let isCaller=false;
let videoCall=false;

const servers={
iceServers:[
{urls:"stun:stun.l.google.com:19302"},
{urls:"stun:stun1.l.google.com:19302"}
]
};


/* ================= LANGUAGE ================= */

let lang=localStorage.getItem("lang")||"ur";

const T={
ur:{
welcome:"خوش آمدید",
search:"نمبر سے صارف تلاش کریں",
users:"صارفین",
online:"🟢 آن لائن",
offline:"⚫ آف لائن",
typing:"لکھ رہا ہے...",
notFound:"اس نمبر سے کوئی صارف رجسٹرڈ نہیں۔",
call:"کال",
video:"ویڈیو کال",
calling:"کال ہو رہی ہے...",
incoming:"آنے والی کال",
voice:"Voice Call",
videoCall:"Video Call"
},
en:{
welcome:"Welcome",
search:"Search user by number",
users:"Users",
online:"🟢 Online",
offline:"⚫ Offline",
typing:"typing...",
notFound:"No user registered with this number.",
call:"Call",
video:"Video Call",
calling:"Calling...",
incoming:"Incoming Call",
voice:"Voice Call",
videoCall:"Video Call"
}
};

window.setLang=(x)=>{
lang=x;
localStorage.setItem("lang",x);
document.documentElement.lang=x;
document.documentElement.dir=x==="ur"?"rtl":"ltr";
applyLang();
};

function applyLang(){
const t=T[lang];

document.getElementById("welcome").textContent=t.welcome;
document.getElementById("searchTitle").textContent=t.search;
document.getElementById("friendsTitle").textContent=t.users;
document.getElementById("incomingName").textContent=t.incoming;
}


/* ================= PHONE AUTH ================= */

window.sendOTP=async()=>{

const phone=document.getElementById("phone").value.trim();

if(!phone){
alert(lang==="ur"?"موبائل نمبر درج کریں۔":"Enter phone number.");
return;
}

try{

if(!window.recaptchaVerifier){

window.recaptchaVerifier=new RecaptchaVerifier(
auth,
"recaptcha",
{
size:"normal"
}
);

}

confirmOTP=await signInWithPhoneNumber(
auth,
phone,
window.recaptchaVerifier
);

alert(
lang==="ur"
?"OTP بھیج دیا گیا ہے۔"
:"OTP sent."
);

}catch(e){

console.error(e);
alert(e.message);

}
};


window.verifyOTP=async()=>{

const code=document.getElementById("otp").value.trim();

if(!confirmOTP){
alert("پہلے OTP حاصل کریں۔");
return;
}

try{

const result=await confirmOTP.confirm(code);

await createUserProfile(
result.user,
document.getElementById("name").value.trim()
);

}catch(e){

console.error(e);
alert(e.message);

}
};


/* ================= EMAIL AUTH ================= */

window.emailRegister=async()=>{

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!name||!email||!password){
alert(lang==="ur"?"تمام معلومات درج کریں۔":"Fill all fields.");
return;
}

try{

const result=
await createUserWithEmailAndPassword(
auth,email,password
);

await createUserProfile(result.user,name);

}catch(e){

console.error(e);
alert(e.message);

}
};


window.emailLogin=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,email,password
);

}catch(e){

console.error(e);
alert(e.message);

}
};


/* ================= USER PROFILE ================= */

async function createUserProfile(user,name){

const ref=doc(db,"users",user.uid);
const old=await getDoc(ref);

const phone=user.phoneNumber||"";

await setDoc(
ref,
{
uid:user.uid,
name:name||old.data()?.name||"User",
email:user.email||"",
phone:phone,
phoneSearch:phone,
online:true,
lastSeen:serverTimestamp(),
createdAt:old.exists()
?old.data().createdAt
:serverTimestamp()
},
{merge:true}
);

}


/* ================= AUTH STATE ================= */

onAuthStateChanged(auth,async user=>{

if(!user){

me=null;

document.getElementById("auth")
.classList.remove("hidden");

document.getElementById("home")
.classList.add("hidden");

document.getElementById("chat")
.classList.add("hidden");

return;
}

me=user;

await createUserProfile(
user,
document.getElementById("name").value.trim()
);

document.getElementById("auth")
.classList.add("hidden");

document.getElementById("home")
.classList.remove("hidden");

loadMyInfo();
loadUsers();
listenIncomingCalls();

});


/* ================= MY INFO ================= */

async function loadMyInfo(){

const snap=
await getDoc(doc(db,"users",me.uid));

if(!snap.exists())return;

const d=snap.data();

document.getElementById("myInfo").innerHTML=
`
<strong>${escapeHTML(d.name||"User")}</strong>
<br>
${escapeHTML(d.phone||d.email||"")}
`;
}


/* ================= USERS ================= */

function loadUsers(){

onSnapshot(
collection(db,"users"),
snap=>{

const box=document.getElementById("users");
box.innerHTML="";

snap.forEach(s=>{

if(s.id===me.uid)return;

const d=s.data();

const div=document.createElement("div");

div.className="user";

const name=document.createElement("div");
name.className="user-name";
name.textContent=d.name||"User";

const status=document.createElement("div");
status.className="status";

status.textContent=d.online
?T[lang].online
:T[lang].offline;

div.appendChild(name);
div.appendChild(status);

div.onclick=()=>openChat({
uid:s.id,
name:d.name||"User",
phone:d.phone||"",
online:d.online||false
});

box.appendChild(div);

});

if(!box.children.length){

box.textContent=
lang==="ur"
?"ابھی کوئی دوسرا صارف موجود نہیں۔"
:"No other users yet.";

}

}
);

}


/* ================= SEARCH ================= */

window.searchUser=async()=>{

let phone=
document.getElementById("searchPhone")
.value.trim();

const result=
document.getElementById("searchResult");

result.innerHTML="Searching...";

try{

const q=query(
collection(db,"users"),
where("phoneSearch","==",phone)
);

const snap=await getDocs(q);

if(snap.empty){

result.textContent=T[lang].notFound;
return;

}

const s=snap.docs[0];
const d=s.data();

const div=document.createElement("div");

div.className="user";

div.innerHTML=
`
<div class="user-name">
${escapeHTML(d.name||"User")}
</div>
<div class="status">
${escapeHTML(d.phone||phone)}
</div>
`;

div.onclick=()=>openChat({
uid:s.id,
name:d.name||"User",
phone:d.phone||phone,
online:d.online||false
});

result.innerHTML="";
result.appendChild(div);

}catch(e){

console.error(e);
result.textContent=e.message;

}

};


/* ================= CHAT ================= */

function chatId(){

return [me.uid,selected.uid]
.sort()
.join("_");

}


window.openChat=(u)=>{

selected=u;

document.getElementById("home")
.classList.add("hidden");

document.getElementById("chat")
.classList.remove("hidden");

document.getElementById("chatName")
.textContent=u.name;

document.getElementById("chatStatus")
textContent=u.online
?T[lang].online
:T[lang].offline;

listenMessages();
listenTyping();

};


function listenMessages(){

if(unsubscribeMessages)
unsubscribeMessages();

const ref=collection(
db,
"chats",
chatId(),
"messages"
);

const q=query(
ref,
orderBy("createdAt","asc")
);

unsubscribeMessages=
onSnapshot(q,snap=>{

const box=document.getElementById("messages");
box.innerHTML="";

snap.forEach(s=>{

const d=s.data();

const div=document.createElement("div");

div.className=
"msg "+
(d.senderId===me.uid?"mine":"theirs");

div.textContent=d.text||"";

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

});

}


/* ================= TYPING ================= */

const messageInput=
document.getElementById("messageInput");

let typingTimer=null;

messageInput.addEventListener("input",async()=>{

if(!me||!selected)return;

await setDoc(
doc(db,"chats",chatId()),
{
typing:{
[me.uid]:true
}
},
{merge:true}
);

clearTimeout(typingTimer);

typingTimer=setTimeout(async()=>{

await setDoc(
doc(db,"chats",chatId()),
{
typing:{
[me.uid]:false
}
},
{merge:true}
);

},1200);

});


function listenTyping(){

if(unsubscribeTyping)
unsubscribeTyping();

unsubscribeTyping=
onSnapshot(
doc(db,"chats",chatId()),
snap=>{

if(!snap.exists())return;

const t=snap.data().typing||{};

document.getElementById("typing")
.textContent=
t[selected.uid]
?T[lang].typing
:"";

}
);

}


/* ================= SEND MESSAGE ================= */

window.sendMessage=async()=>{

const input=
document.getElementById("messageInput");

const text=input.value.trim();

if(!text||!selected)return;

await addDoc(
collection(
db,
"chats",
chatId(),
"messages"
),
{
text:text,
senderId:me.uid,
receiverId:selected.uid,
createdAt:serverTimestamp()
}
);

input.value="";

};


/* ================= CLOSE CHAT ================= */

window.closeChat=()=>{

if(unsubscribeMessages)
unsubscribeMessages();

if(unsubscribeTyping)
unsubscribeTyping();

document.getElementById("chat")
.classList.add("hidden");

document.getElementById("home")
.classList.remove("hidden");

};


/* ================= LAST SEEN ================= */

setInterval(async()=>{

if(!me)return;

try{

await setDoc(
doc(db,"users",me.uid),
{
online:true,
lastSeen:serverTimestamp()
},
{merge:true}
);

}catch(e){}

},20000);

document.addEventListener(
"visibilitychange",
async()=>{

if(!me)return;

await setDoc(
doc(db,"users",me.uid),
{
online:!document.hidden,
lastSeen:serverTimestamp()
},
{merge:true}
);

}
);


/* ================= VOICE / VIDEO CALL ================= */

window.startCall=async(isVideo)=>{

if(!selected)return;

videoCall=isVideo;
isCaller=true;

currentCallId=
me.uid+"_"+Date.now();

document.getElementById("callScreen")
.classList.remove("hidden");

document.getElementById("callTitle")
.textContent=
isVideo
?T[lang].videoCall
:T[lang].voice;


try{

localStream=
await navigator.mediaDevices.getUserMedia({

audio:true,
video:isVideo

});

document.getElementById("localVideo")
.srcObject=localStream;

if(!isVideo)
document.getElementById("localVideo")
.classList.add("hidden");
else
document.getElementById("localVideo")
.classList.remove("hidden");

remoteStream=
new MediaStream();

document.getElementById("remoteVideo")
.srcObject=remoteStream;

pc=new RTCPeerConnection(servers);

localStream.getTracks()
.forEach(track=>{
pc.addTrack(track,localStream);
});

pc.ontrack=e=>{

e.streams[0]
.getTracks()
.forEach(track=>{
remoteStream.addTrack(track);
});

};

pc.onicecandidate=async e=>{

if(!e.candidate)return;

await addDoc(
collection(
db,
"calls",
currentCallId,
"offerCandidates"
),
e.candidate.toJSON()
);

};


const offer=
await pc.createOffer();

await pc.setLocalDescription(offer);

await setDoc(
doc(db,"calls",currentCallId),
{
callerId:me.uid,
calleeId:selected.uid,
callerName:
document.getElementById("myInfo").textContent,
type:isVideo?"video":"voice",
offer:{
type:offer.type,
sdp:offer.sdp
},
status:"ringing",
createdAt:serverTimestamp()
}
);


listenAnswer();

}catch(e){

console.error(e);

alert(
"Camera/Microphone permission required: "+
e.message
);

endCall();

}

};


/* ================= ANSWER LISTENER ================= */

function listenAnswer(){

onSnapshot(
doc(db,"calls",currentCallId),
async snap=>{

if(!snap.exists())return;

const data=snap.data();

if(
data.answer &&
pc &&
!pc.currentRemoteDescription
){

await pc.setRemoteDescription(
new RTCSessionDescription(
data.answer
)
);

}

}
);


/* Caller candidates */

onSnapshot(
collection(
db,
"calls",
currentCallId,
"answerCandidates"
),
snap=>{

snap.docChanges().forEach(async change=>{

if(change.type==="added"){

await pc.addIceCandidate(
new RTCIceCandidate(
change.doc.data()
)
);

}

});

}
);

}


/* ================= INCOMING CALL ================= */

function listenIncomingCalls(){

if(unsubscribeCall)
unsubscribeCall();

const q=query(
collection(db,"calls"),
where("calleeId","==",me.uid),
where("status","==","ringing")
);

unsubscribeCall=
onSnapshot(q,snap=>{

snap.docChanges().forEach(change=>{

if(change.type!=="added")return;

const d=change.doc.data();

currentCallId=change.doc.id;

videoCall=d.type==="video";

document.getElementById("incomingName")
.textContent=
d.callerName||"Unknown";

document.getElementById("incomingType")
.textContent=
videoCall
?T[lang].videoCall
:T[lang].voice;

document.getElementById("incoming")
.classList.remove("hidden");

});

});

}


/* ================= ACCEPT CALL ================= */

window.acceptCall=async()=>{

document.getElementById("incoming")
.classList.add("hidden");

isCaller=false;

const callSnap=
await getDoc(
doc(db,"calls",currentCallId)
);

const data=callSnap.data();

videoCall=data.type==="video";

document.getElementById("callScreen")
.classList.remove("hidden");

try{

localStream=
await navigator.mediaDevices.getUserMedia({

audio:true,
video:videoCall

});

document.getElementById("localVideo")
.srcObject=localStream;

if(!videoCall)
document.getElementById("localVideo")
.classList.add("hidden");
else
document.getElementById("localVideo")
.classList.remove("hidden");

remoteStream=
new MediaStream();

document.getElementById("remoteVideo")
.srcObject=remoteStream;

pc=new RTCPeerConnection(servers);

localStream.getTracks()
.forEach(track=>{
pc.addTrack(track,localStream);
});

pc.ontrack=e=>{

e.streams[0]
.getTracks()
.forEach(track=>{
remoteStream.addTrack(track);
});

};

pc.onicecandidate=async e=>{

if(!e.candidate)return;

await addDoc(
collection(
db,
"calls",
currentCallId,
"answerCandidates"
),
e.candidate.toJSON()
);

};


await pc.setRemoteDescription(
new RTCSessionDescription(data.offer)
);


const answer=
await pc.createAnswer();

await pc.setLocalDescription(answer);

await updateDoc(
doc(db,"calls",currentCallId),
{
answer:{
type:answer.type,
sdp:answer.sdp
},
status:"answered"
}
);


onSnapshot(
collection(
db,
"calls",
currentCallId,
"offerCandidates"
),
snap=>{

snap.docChanges().forEach(async change=>{

if(change.type==="added"){

await pc.addIceCandidate(
new RTCIceCandidate(
change.doc.data()
)
);

}

});

}
);

}catch(e){

console.error(e);

alert(e.message);

endCall();

}

};


/* ================= REJECT ================= */

window.rejectCall=async()=>{

document.getElementById("incoming")
.classList.add("hidden");

if(currentCallId){

await updateDoc(
doc(db,"calls",currentCallId),
{
status:"rejected"
}
);

}

};


/* ================= END CALL ================= */

window.endCall=async()=>{

if(localStream){

localStream.getTracks()
.forEach(t=>t.stop());

localStream=null;

}

if(pc){

pc.close();
pc=null;

}

document.getElementById("callScreen")
.classList.add("hidden");

document.getElementById("incoming")
.classList.add("hidden");

if(currentCallId){

try{

await updateDoc(
doc(db,"calls",currentCallId),
{
status:"ended"
}
);

}catch(e){}

}

currentCallId=null;

};


/* ================= MUTE ================= */

window.toggleMute=()=>{

if(!localStream)return;

localStream.getAudioTracks()
.forEach(t=>{
t.enabled=!t.enabled;
});

};


/* ================= CAMERA ================= */

window.toggleCamera=()=>{

if(!localStream)return;

localStream.getVideoTracks()
.forEach(t=>{
t.enabled=!t.enabled;
});

};


/* ================= LOGOUT ================= */

window.logout=async()=>{

if(me){

await setDoc(
doc(db,"users",me.uid),
{
online:false,
lastSeen:serverTimestamp()
},
{merge:true}
);

}

await signOut(auth);

};


/* ================= HELPERS ================= */

function escapeHTML(x){

const d=document.createElement("div");
d.textContent=x||"";
return d.innerHTML;

}

applyLang();

</script>
