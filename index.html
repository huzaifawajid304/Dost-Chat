<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dost Chat</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#e9edef;
}

.app{
 max-width:520px;
 margin:auto;
 min-height:100vh;
 background:white;
}

.header{
 background:#075e54;
 color:white;
 padding:17px;
 text-align:center;
 font-size:24px;
 font-weight:bold;
}

.lang{
 display:flex;
 gap:5px;
 padding:7px;
 background:#f5f5f5;
}

.lang button{
 flex:1;
}

.box{
 padding:15px;
}

input,select{
 width:100%;
 padding:13px;
 margin:5px 0;
 border:1px solid #ccc;
 border-radius:9px;
 font-size:16px;
}

button{
 border:0;
 border-radius:9px;
 padding:12px;
 margin:5px 0;
 background:#075e54;
 color:white;
 font-size:15px;
}

.full{
 width:100%;
}

.green{background:#128c7e}
.blue{background:#1976d2}
.red{background:#d32f2f}
.gray{background:#777}

.hidden{
 display:none!important;
}

.user,.group{
 background:#f3f3f3;
 padding:13px;
 margin:7px 0;
 border-radius:10px;
 cursor:pointer;
}

.user strong,.group strong{
 display:block;
 font-size:17px;
}

.small{
 color:#777;
 font-size:13px;
}

.search{
 display:flex;
 gap:5px;
}

.search input{
 flex:1;
}

.search button{
 width:85px;
}

.tabs{
 display:flex;
 gap:5px;
 margin-bottom:10px;
}

.tabs button{
 flex:1;
}

.chatHead{
 background:#075e54;
 color:white;
 padding:10px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.chatActions{
 display:flex;
 gap:3px;
}

.chatActions button{
 margin:0;
 padding:8px;
}

.typing{
 font-size:12px;
 color:#caffca;
}

.messages{
 height:calc(100vh - 245px);
 min-height:400px;
 overflow-y:auto;
 background:#e5ddd5;
 padding:12px;
}

.msg{
 max-width:78%;
 padding:9px 12px;
 margin:6px 0;
 border-radius:10px;
 clear:both;
 word-break:break-word;
}

.mine{
 float:right;
 background:#dcf8c6;
}

.theirs{
 float:left;
 background:white;
}

.time{
 display:block;
 font-size:10px;
 color:#777;
 margin-top:4px;
}

.send{
 display:flex;
 gap:5px;
 padding:7px;
}

.send input{
 flex:1;
 margin:0;
}

.send button{
 width:75px;
 margin:0;
}

.callScreen{
 position:fixed;
 inset:0;
 z-index:1000;
 background:#111;
 color:white;
}

.remoteVideo{
 width:100%;
 height:100%;
 object-fit:cover;
 background:#222;
}

.localVideo{
 position:absolute;
 top:65px;
 right:12px;
 width:120px;
 height:170px;
 object-fit:cover;
 border:2px solid white;
 border-radius:10px;
 background:#333;
}

.callTop{
 position:absolute;
 top:15px;
 left:0;
 right:0;
 text-align:center;
 z-index:3;
}

.callButtons{
 position:absolute;
 bottom:25px;
 left:0;
 right:0;
 text-align:center;
 z-index:3;
}

.callButtons button{
 width:60px;
 height:55px;
 border-radius:50%;
 margin:5px;
}

.incoming{
 position:fixed;
 inset:0;
 z-index:2000;
 background:rgba(0,0,0,.9);
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
}

.incomingBox{
 width:90%;
 max-width:350px;
 padding:25px;
}

.modal{
 position:fixed;
 inset:0;
 z-index:1500;
 background:rgba(0,0,0,.7);
 display:flex;
 align-items:center;
 justify-content:center;
}

.modalBox{
 width:92%;
 max-width:400px;
 background:white;
 border-radius:12px;
 padding:18px;
 max-height:90vh;
 overflow:auto;
}

.member{
 padding:10px;
 border-bottom:1px solid #ddd;
}

.check{
 width:auto;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
 Dost Chat
</div>

<div class="lang">
<button onclick="changeLang('ur')">اردو</button>
<button onclick="changeLang('en')">English</button>
</div>


<!-- LOGIN -->

<section id="loginPage">

<div class="box">

<h2 id="loginTitle">Login / رجسٹریشن</h2>

<input id="nameInput" placeholder="نام">

<input id="emailInput" type="email" placeholder="Email">

<input id="passwordInput" type="password" placeholder="Password">

<button class="full" onclick="registerEmail()">
رجسٹر کریں
</button>

<button class="green full" onclick="loginEmail()">
Login
</button>

<hr>

<input id="phoneInput" placeholder="+923001234567">

<div id="recaptcha"></div>

<button class="blue full" onclick="sendPhoneOTP()">
📱 موبائل OTP بھیجیں
</button>

<input id="otpInput" placeholder="OTP">

<button class="green full" onclick="verifyPhoneOTP()">
OTP Verify
</button>

<div id="loginMessage"></div>

</div>

</section>


<!-- HOME -->

<section id="homePage" class="hidden">

<div class="box">

<h2 id="welcomeText">خوش آمدید</h2>

<div id="myProfile"></div>

<button class="red full" onclick="logout()">
Logout
</button>

<div class="tabs">
<button onclick="showUsers()">👤 Users</button>
<button onclick="showGroups()">👥 Groups</button>
<button onclick="openGroupModal()">➕ Group</button>
</div>

<div class="search">

<input
 id="numberSearch"
 placeholder="+923001234567">

<button onclick="searchNumber()">
Search
</button>

</div>

<div id="searchResult"></div>

<div id="content"></div>

</div>

</section>


<!-- CHAT -->

<section id="chatPage" class="hidden">

<div class="chatHead">

<div>

<strong id="chatName"></strong>

<div id="chatStatus"></div>

<div id="typingText" class="typing"></div>

</div>

<div class="chatActions">

<button onclick="startCall(false)">
🎤
</button>

<button onclick="startCall(true)">
📹
</button>

<button onclick="closeChat()">
↩
</button>

</div>

</div>

<div id="messages" class="messages"></div>

<div class="send">

<input
 id="messageInput"
 placeholder="پیغام لکھیں...">

<button onclick="sendMessage()">
Send
</button>

</div>

</section>

</div>


<!-- GROUP MODAL -->

<div id="groupModal" class="modal hidden">

<div class="modalBox">

<h2 id="groupTitle">
Create Group
</h2>

<input
 id="groupName"
 placeholder="Group Name">

<div id="memberList"></div>

<button
 class="green full"
 onclick="createGroup()">
Create Group
</button>

<button
 class="red full"
 onclick="closeGroupModal()">
Cancel
</button>

</div>

</div>


<!-- CALL -->

<div id="callScreen" class="callScreen hidden">

<div class="callTop">
<div id="callName"></div>
<div id="callType"></div>
</div>

<video
 id="remoteVideo"
 class="remoteVideo"
 autoplay
 playsinline>
</video>

<video
 id="localVideo"
 class="localVideo"
 autoplay
 muted
 playsinline>
</video>

<div class="callButtons">

<button onclick="toggleMic()">
🎤
</button>

<button onclick="toggleCamera()">
📹
</button>

<button class="red" onclick="endCall()">
📞
</button>

</div>

</div>


<!-- INCOMING CALL -->

<div id="incomingCall" class="incoming hidden">

<div class="incomingBox">

<h1>📞</h1>

<h2 id="incomingCaller">
Incoming Call
</h2>

<p id="incomingCallType"></p>

<button
 class="green full"
 onclick="acceptCall()">
Accept
</button>

<button
 class="red full"
 onclick="rejectCall()">
Reject
</button>

</div>

</div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 signInWithEmailAndPassword,
 signInWithPhoneNumber,
 RecaptchaVerifier,
 onAuthStateChanged,
 signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 doc,
 setDoc,
 getDoc,
 getDocs,
 addDoc,
 query,
 where,
 orderBy,
 onSnapshot,
 serverTimestamp,
 updateDoc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={
 apiKey:"AIzaSyBvEGBT5yvkcPoziNc3U9rh87IEkOn_7eM",
 authDomain:"dost-chat-a7eec.firebaseapp.com",
 projectId:"dost-chat-a7eec",
 storageBucket:"dost-chat-a7eec.firebasestorage.app",
 messagingSenderId:"760944205758",
 appId:"1:760944205758:web:41d06ed0c34b3f24f8a3ef"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* VARIABLES */

let currentUser=null;
let selectedUser=null;
let selectedGroup=null;

let confirmOTP=null;

let messageUnsub=null;
let typingUnsub=null;
let callUnsub=null;

let peer=null;
let localStream=null;
let remoteStream=null;

let currentCallId=null;
let caller=false;
let videoMode=false;


/* LANGUAGE */

let lang=
localStorage.getItem("lang")||"ur";

const text={
ur:{
 online:"🟢 آن لائن",
 offline:"⚫ آف لائن",
 typing:"لکھ رہا ہے...",
 noUsers:"کوئی دوسرا صارف نہیں۔",
 noGroups:"ابھی کوئی گروپ نہیں۔",
 notFound:"اس نمبر سے کوئی صارف رجسٹرڈ نہیں۔",
 voice:"Voice Call",
 video:"Video Call"
},
en:{
 online:"🟢 Online",
 offline:"⚫ Offline",
 typing:"typing...",
 noUsers:"No other users.",
 noGroups:"No groups yet.",
 notFound:"No user registered with this number.",
 voice:"Voice Call",
 video:"Video Call"
}
};

window.changeLang=function(x){

lang=x;

localStorage.setItem("lang",x);

document.documentElement.lang=x;

document.documentElement.dir=
x==="ur"?"rtl":"ltr";

};


/* EMAIL REGISTER */

window.registerEmail=async()=>{

const name=
document.getElementById("nameInput")
.value.trim();

const email=
document.getElementById("emailInput")
.value.trim();

const password=
document.getElementById("passwordInput")
.value;

if(!name||!email||!password){

showLogin("تمام معلومات درج کریں۔");

return;
}

try{

const result=
await createUserWithEmailAndPassword(
auth,email,password
);

await saveProfile(
result.user,
name
);

}catch(e){

console.error(e);

showLogin(e.message);

}

};


/* EMAIL LOGIN */

window.loginEmail=async()=>{

const email=
document.getElementById("emailInput")
.value.trim();

const password=
document.getElementById("passwordInput")
.value;

if(!email||!password){

showLogin("Email اور Password درج کریں۔");

return;
}

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(e){

console.error(e);

showLogin(e.message);

}

};


/* PHONE OTP */

window.sendPhoneOTP=async()=>{

const phone=
document.getElementById("phoneInput")
.value.trim();

if(!phone){

showLogin("موبائل نمبر درج کریں۔");

return;
}

try{

if(!window.phoneRecaptcha){

window.phoneRecaptcha=
new RecaptchaVerifier(
auth,
"recaptcha",
{
size:"normal"
}
);

}

confirmOTP=
await signInWithPhoneNumber(
auth,
phone,
window.phoneRecaptcha
);

showLogin("OTP بھیج دیا گیا ہے۔");

}catch(e){

console.error(e);

showLogin(e.message);

}

};


window.verifyPhoneOTP=async()=>{

const code=
document.getElementById("otpInput")
.value.trim();

if(!confirmOTP){

showLogin("پہلے OTP حاصل کریں۔");

return;
}

try{

const result=
await confirmOTP.confirm(code);

await saveProfile(
result.user,
document.getElementById("nameInput")
.value.trim()
);

}catch(e){

console.error(e);

showLogin(e.message);

}

};


/* SAVE PROFILE */

async function saveProfile(user,name){

const ref=
doc(db,"users",user.uid);

const old=
await getDoc(ref);

await setDoc(
ref,
{
uid:user.uid,
name:name||
(old.exists()?old.data().name:"User"),
email:user.email||"",
phone:user.phoneNumber||(
old.exists()?old.data().phone||"":""
),
phoneSearch:user.phoneNumber||(
old.exists()?old.data().phoneSearch||"":""
),
online:true,
lastSeen:serverTimestamp(),
createdAt:
old.exists()
?old.data().createdAt
:serverTimestamp()
},
{merge:true}
);

}


/* AUTH STATE */

onAuthStateChanged(
auth,
async user=>{

if(!user){

currentUser=null;

show("loginPage");

hide("homePage");

hide("chatPage");

return;
}

currentUser=user;

await saveProfile(user,"");

hide("loginPage");

show("homePage");

loadProfile();

showUsers();

listenIncomingCalls();

}
);


/* PROFILE */

async function loadProfile(){

const snap=
await getDoc(
doc(db,"users",currentUser.uid)
);

if(!snap.exists())return;

const d=snap.data();

document.getElementById("myProfile")
.innerHTML=
`
<strong>${safe(d.name||"User")}</strong>
<br>
${safe(d.phone||d.email||"")}
`;

}


/* USERS */

window.showUsers=function(){

const box=
document.getElementById("content");

box.innerHTML="";

onSnapshot(
collection(db,"users"),
snap=>{

box.innerHTML="";

let count=0;

snap.forEach(s=>{

if(s.id===currentUser.uid)return;

count++;

const d=s.data();

const div=
document.createElement("div");

div.className="user";

div.innerHTML=
`
<strong>${safe(d.name||"User")}</strong>
<div class="small">
${d.online
?text[lang].online
:text[lang].offline}
</div>
`;

div.onclick=()=>openPrivateChat({
uid:s.id,
name:d.name||"User",
online:d.online||false
});

box.appendChild(div);

});

if(count===0)
box.textContent=text[lang].noUsers;

}
);

};


/* NUMBER SEARCH */

window.searchNumber=async()=>{

const phone=
document.getElementById("numberSearch")
.value.trim();

const result=
document.getElementById("searchResult");

result.textContent="Searching...";

const q=query(
collection(db,"users"),
where("phoneSearch","==",phone)
);

const snap=await getDocs(q);

if(snap.empty){

result.textContent=text[lang].notFound;

return;
}

const s=snap.docs[0];

const d=s.data();

const div=
document.createElement("div");

div.className="user";

div.innerHTML=
`
<strong>${safe(d.name||"User")}</strong>
<div class="small">${safe(d.phone||phone)}</div>
`;

div.onclick=()=>openPrivateChat({
uid:s.id,
name:d.name||"User",
online:d.online||false
});

result.innerHTML="";

result.appendChild(div);

};


/* PRIVATE CHAT */

function privateId(){

return [
currentUser.uid,
selectedUser.uid
]
.sort()
.join("_");

}


function openPrivateChat(user){

selectedUser=user;

selectedGroup=null;

hide("homePage");

show("chatPage");

document.getElementById("chatName")
.textContent=user.name;

document.getElementById("chatStatus")
.textContent=
user.online
?text[lang].online
:text[lang].offline;

listenPrivateMessages();

listenTyping();

}


function listenPrivateMessages(){

if(messageUnsub)
messageUnsub();

const ref=
collection(
db,
"chats",
privateId(),
"messages"
);

const q=query(
ref,
orderBy("createdAt","asc")
);

messageUnsub=
onSnapshot(
q,
snap=>{

const box=
document.getElementById("messages");

box.innerHTML="";

snap.forEach(s=>{

const d=s.data();

const div=
document.createElement("div");

div.className=
"msg "+
(
d.senderId===currentUser.uid
?"mine"
:"theirs"
);

div.textContent=d.text;

box.appendChild(div);

});

box.scrollTop=
box.scrollHeight;

},
error=>{

console.error(error);

document.getElementById("messages")
.textContent=
"Message error: "+error.message;

}
);

}


/* SEND PRIVATE MESSAGE */

window.sendMessage=async()=>{

const input=
document.getElementById("messageInput");

const value=
input.value.trim();

if(!value)return;

try{

if(selectedUser){

await addDoc(
collection(
db,
"chats",
privateId(),
"messages"
),
{
text:value,
senderId:currentUser.uid,
receiverId:selectedUser.uid,
createdAt:serverTimestamp()
}
);

}

else if(selectedGroup){

await addDoc(
collection(
db,
"groups",
selectedGroup.id,
"messages"
),
{
text:value,
senderId:currentUser.uid,
senderName:selectedGroup.name,
createdAt:serverTimestamp()
}
);

}

input.value="";

}catch(e){

console.error(e);

alert("Message error: "+e.message);

}

};


/* TYPING */

let typingTimer=null;

document
.getElementById("messageInput")
.addEventListener(
"input",
async()=>{

if(!selectedUser)return;

const id=privateId();

await setDoc(
doc(db,"chats",id),
{
typing:{
[currentUser.uid]:true
}
},
{merge:true}
);

clearTimeout(typingTimer);

typingTimer=
setTimeout(async()=>{

await setDoc(
doc(db,"chats",id),
{
typing:{
[currentUser.uid]:false
}
},
{merge:true}
);

},1200);

}
);


function listenTyping(){

if(typingUnsub)
typingUnsub();

if(!selectedUser)return;

typingUnsub=
onSnapshot(
doc(db,"chats",privateId()),
snap=>{

if(!snap.exists())return;

const t=snap.data().typing||{};

document.getElementById("typingText")
.textContent=
t[selectedUser.uid]
?text[lang].typing
:"";

}
);

}


/* GROUPS */

window.showGroups=function(){

const box=
document.getElementById("content");

box.innerHTML="Loading...";

onSnapshot(
collection(db,"groups"),
snap=>{

box.innerHTML="";

let count=0;

snap.forEach(s=>{

const d=s.data();

const members=d.members||[];

if(!members.includes(currentUser.uid))
return;

count++;

const div=
document.createElement("div");

div.className="group";

div.innerHTML=
`
<strong>👥 ${safe(d.name)}</strong>
<div class="small">
${members.length} Members
</div>
`;

div.onclick=()=>openGroup({
id:s.id,
name:d.name,
members:members
});

box.appendChild(div);

});

if(count===0)
box.textContent=text[lang].noGroups;

}
);

};


/* GROUP MODAL */

window.openGroupModal=function(){

show("groupModal");

loadMemberList();

};

window.closeGroupModal=function(){

hide("groupModal");

};


async function loadMemberList(){

const box=
document.getElementById("memberList");

box.innerHTML="";

const snap=
await getDocs(collection(db,"users"));

snap.forEach(s=>{

if(s.id===currentUser.uid)return;

const d=s.data();

const div=
document.createElement("div");

div.className="member";

div.innerHTML=
`
<label>
<input
 class="check"
 type="checkbox"
 value="${s.id}">
 ${safe(d.name||"User")}
</label>
`;

box.appendChild(div);

});

}


/* CREATE GROUP */

window.createGroup=async()=>{

const name=
document.getElementById("groupName")
.value.trim();

if(!name){

alert("Group name لکھیں۔");

return;
}

const checked=
[
...document.querySelectorAll(
"#memberList input:checked"
)
]
.map(x=>x.value);

checked.push(currentUser.uid);

try{

const ref=
await addDoc(
collection(db,"groups"),
{
name:name,
ownerId:currentUser.uid,
members:checked,
createdAt:serverTimestamp()
}
);

hide("groupModal");

document.getElementById("groupName")
.value="";

showGroups();

}catch(e){

console.error(e);

alert(e.message);

}

};


/* OPEN GROUP */

function openGroup(group){

selectedGroup=group;

selectedUser=null;

hide("homePage");

show("chatPage");

document.getElementById("chatName")
.textContent="👥 "+group.name;

document.getElementById("chatStatus")
.textContent=
group.members.length+" Members";

listenGroupMessages();

}


function listenGroupMessages(){

if(messageUnsub)
messageUnsub();

const ref=
collection(
db,
"groups",
selectedGroup.id,
"messages"
);

const q=query(
ref,
orderBy("createdAt","asc")
);

messageUnsub=
onSnapshot(
q,
snap=>{

const box=
document.getElementById("messages");

box.innerHTML="";

snap.forEach(s=>{

const d=s.data();

const div=
document.createElement("div");

div.className=
"msg "+
(
d.senderId===currentUser.uid
?"mine"
:"theirs"
);

div.textContent=
(d.senderName||"User")+": "+d.text;

box.appendChild(div);

});

box.scrollTop=
box.scrollHeight;

}
);

}


/* CLOSE CHAT */

window.closeChat=function(){

if(messageUnsub)
messageUnsub();

if(typingUnsub)
typingUnsub();

hide("chatPage");

show("homePage");

selectedUser=null;
selectedGroup=null;

};


/* =========================
   WEBRTC CALL
========================= */

const rtcConfig={
iceServers:[
{
urls:"stun:stun.l.google.com:19302"
},
{
urls:"stun:stun1.l.google.com:19302"
}
]
};


window.startCall=async function(video){

if(!selectedUser){

alert(
"Private user chat میں call کریں۔"
);

return;
}

caller=true;

videoMode=video;

currentCallId=
currentUser.uid+"_"+Date.now();

try{

localStream=
await navigator.mediaDevices
.getUserMedia({
audio:true,
video:video
});

show("callScreen");

document.getElementById("callName")
.textContent=selectedUser.name;

document.getElementById("callType")
.textContent=
video?text[lang].video:text[lang].voice;

document.getElementById("localVideo")
.srcObject=localStream;

if(video)
show("localVideo");
else
hide("localVideo");

remoteStream=new MediaStream();

document.getElementById("remoteVideo")
.srcObject=remoteStream;

peer=new RTCPeerConnection(rtcConfig);

localStream.getTracks()
.forEach(track=>{
peer.addTrack(track,localStream);
});

peer.ontrack=e=>{

e.streams[0]
.getTracks()
.forEach(track=>{
remoteStream.addTrack(track);
});

};

peer.onicecandidate=async e=>{

if(!e.candidate)return;

await addDoc(
collection(
db,
"calls",
currentCallId,
"offerCandidates"
),
e.candidate.toJSON()
);

};

const offer=
await peer.createOffer();

await peer.setLocalDescription(offer);

await setDoc(
doc(db,"calls",currentCallId),
{
callerId:currentUser.uid,
callerName:
await getMyName(),
calleeId:selectedUser.uid,
type:video?"video":"voice",
offer:{
type:offer.type,
sdp:offer.sdp
},
status:"ringing",
createdAt:serverTimestamp()
}
);

watchAnswer();

}catch(e){

console.error(e);

alert(
"Microphone/Camera permission: "+
e.message
);

endCall();

}

};


/* WATCH ANSWER */

function watchAnswer(){

onSnapshot(
doc(db,"calls",currentCallId),
async snap=>{

if(!snap.exists())return;

const d=snap.data();

if(
d.answer &&
peer &&
!peer.currentRemoteDescription
){

await peer.setRemoteDescription(
new RTCSessionDescription(d.answer)
);

}

}
);

onSnapshot(
collection(
db,
"calls",
currentCallId,
"answerCandidates"
),
snap=>{

snap.docChanges().forEach(async change=>{

if(change.type==="added"&&peer){

try{

await peer.addIceCandidate(
new RTCIceCandidate(change.doc.data())
);

}catch(e){

console.error(e);

}

}

});

}
);

}


/* INCOMING CALLS */

function listenIncomingCalls(){

if(callUnsub)
callUnsub();

const q=query(
collection(db,"calls"),
where("calleeId","==",currentUser.uid),
where("status","==","ringing")
);

callUnsub=
onSnapshot(
q,
snap=>{

snap.docChanges().forEach(change=>{

if(change.type!=="added")
return;

const d=change.doc.data();

currentCallId=change.doc.id;

videoMode=d.type==="video";

document.getElementById("incomingCaller")
.textContent=d.callerName||"User";

document.getElementById("incomingCallType")
.textContent=
videoMode
?text[lang].video
:text[lang].voice;

show("incomingCall");

});

}
);

}


/* ACCEPT */

window.acceptCall=async function(){

hide("incomingCall");

caller=false;

const snap=
await getDoc(
doc(db,"calls",currentCallId)
);

if(!snap.exists())return;

const data=snap.data();

try{

localStream=
await navigator.mediaDevices
.getUserMedia({
audio:true,
video:videoMode
});

show("callScreen");

document.getElementById("callName")
.textContent=data.callerName;

document.getElementById("callType")
.textContent=
videoMode
?text[lang].video
:text[lang].voice;

document.getElementById("localVideo")
.srcObject=localStream;

if(videoMode)
show("localVideo");
else
hide("localVideo");

remoteStream=new MediaStream();

document.getElementById("remoteVideo")
.srcObject=remoteStream;

peer=
new RTCPeerConnection(rtcConfig);

localStream.getTracks()
.forEach(track=>{
peer.addTrack(track,localStream);
});

peer.ontrack=e=>{

e.streams[0]
.getTracks()
.forEach(track=>{
remoteStream.addTrack(track);
});

};

peer.onicecandidate=async e=>{

if(!e.candidate)return;

await addDoc(
collection(
db,
"calls",
currentCallId,
"answerCandidates"
),
e.candidate.toJSON()
);

};

await peer.setRemoteDescription(
new RTCSessionDescription(data.offer)
);

const answer=
await peer.createAnswer();

await peer.setLocalDescription(answer);

await updateDoc(
doc(db,"calls",currentCallId),
{
answer:{
type:answer.type,
sdp:answer.sdp
},
status:"answered"
}
);

onSnapshot(
collection(
db,
"calls",
currentCallId,
"offerCandidates"
),
snap=>{

snap.docChanges()
.forEach(async change=>{

if(change.type==="added"){

try{

await peer.addIceCandidate(
new RTCIceCandidate(
change.doc.data()
)
);

}catch(e){

console.error(e);

}

}

});

}
);

}catch(e){

console.error(e);

alert(e.message);

endCall();

}

};


/* REJECT */

window.rejectCall=async function(){

hide("incomingCall");

if(currentCallId){

await updateDoc(
doc(db,"calls",currentCallId),
{
status:"rejected"
}
);

}

};


/* END CALL */

window.endCall=async function(){

if(localStream){

localStream.getTracks()
.forEach(track=>track.stop());

localStream=null;

}

if(peer){

peer.close();

peer=null;

}

hide("callScreen");

if(currentCallId){

try{

await updateDoc(
doc(db,"calls",currentCallId),
{
status:"ended"
}
);

}catch(e){}

}

currentCallId=null;

};


/* MIC */

window.toggleMic=function(){

if(!localStream)return;

localStream.getAudioTracks()
.forEach(track=>{
track.enabled=!track.enabled;
});

};


/* CAMERA */

window.toggleCamera=function(){

if(!localStream)return;

localStream.getVideoTracks()
.forEach(track=>{
track.enabled=!track.enabled;
});

};


/* LOGOUT */

window.logout=async function(){

if(currentUser){

await setDoc(
doc(db,"users",currentUser.uid),
{
online:false,
lastSeen:serverTimestamp()
},
{merge:true}
);

}

await signOut(auth);

};


/* ONLINE */

setInterval(async()=>{

if(!currentUser)return;

await setDoc(
doc(db,"users",currentUser.uid),
{
online:true,
lastSeen:serverTimestamp()
},
{merge:true}
);

},20000);


/* HELPERS */

async function getMyName(){

const snap=
await getDoc(
doc(db,"users",currentUser.uid)
);

return snap.exists()
?snap.data().name||"User"
:"User";

}

function safe(value){

const div=
document.createElement("div");

div.textContent=value||"";

return div.innerHTML;

}

function show(id){

document.getElementById(id)
.classList.remove("hidden");

}

function hide(id){

document.getElementById(id)
.classList.add("hidden");

}

function showLogin(message){

document.getElementById("loginMessage")
.textContent=message;

}


/* START */

changeLang(lang);

</script>
