<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dost Chat</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#e5ddd5}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
.hidden{display:none!important}
.header,.chat-head,.page-head{
background:#075e54;color:#fff
}
.header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.title{font-size:21px;font-weight:bold}
.header button,.chat-head button,.page-head button{
background:transparent;border:0;color:#fff;font-size:27px
}
.lang{display:flex;gap:5px;padding:5px;background:#eee}
button{border:0;border-radius:7px;padding:11px;background:#075e54;color:#fff;font-size:15px}
.lang button{flex:1}
.full{width:100%;margin:5px 0}
.blue{background:#1976d2}.red{background:#d32f2f}.gray{background:#777}
.box{padding:16px}
input{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
.menu{
position:fixed;z-index:1000;top:58px;
right:max(calc(50% - 250px),5px);width:250px;
background:#fff;box-shadow:0 5px 25px #0005;
border-radius:8px;overflow:hidden
}
.menu button{width:100%;display:block;text-align:right;background:#fff;color:#222;border-radius:0;border-bottom:1px solid #eee}
.profile{display:flex;align-items:center;gap:12px;padding:10px 0}
.avatar,.user img,.chat-avatar{
border-radius:50%;object-fit:cover;background:#ddd
}
.avatar{width:55px;height:55px}
.user{padding:13px;margin:7px 0;background:#f3f3f3;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px}
.user img{width:45px;height:45px}
.status{font-size:13px;color:#777}
.search{display:flex;gap:5px}
.search input{flex:1}.search button{width:85px}
.chat-head{height:60px;display:flex;align-items:center;gap:8px;padding:5px}
.chat-info{flex:1}.chat-actions{display:flex;gap:2px}
.chat-actions button{background:transparent;font-size:20px;padding:7px}
.chat-avatar{width:43px;height:43px}
.messages{height:calc(100vh - 205px);min-height:400px;overflow-y:auto;padding:12px;background:#e5ddd5}
.msg{max-width:78%;padding:9px 12px;margin:6px 0;border-radius:10px;word-break:break-word;clear:both}
.mine{float:right;background:#dcf8c6}.theirs{float:left;background:#fff}
.send{display:flex;gap:5px;padding:7px;background:#eee}
.send input{flex:1;margin:0}.send button{width:75px;margin:0}
.page-head{height:60px;display:flex;align-items:center;gap:10px;padding:5px}
.option{padding:16px;border-bottom:1px solid #eee}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:3000}
.modal-box{width:92%;max-width:400px;background:#fff;border-radius:12px;padding:18px}
.profile-large{width:100px;height:100px;border-radius:50%;object-fit:cover;display:block;margin:10px auto;background:#ddd}
.call-screen{position:fixed;inset:0;background:#111;z-index:5000;color:#fff;display:flex;flex-direction:column}
.call-top{text-align:center;padding:15px}
.videos{position:relative;flex:1;background:#000}
#remoteVideo{width:100%;height:100%;object-fit:cover}
#localVideo{position:absolute;right:12px;bottom:12px;width:120px;height:170px;object-fit:cover;border:2px solid #fff;border-radius:10px;background:#222}
.call-buttons{display:flex;justify-content:center;align-items:center;gap:8px;padding:12px;flex-wrap:wrap}
.call-buttons button{width:52px;height:52px;border-radius:50%;font-size:19px}
.incoming{position:fixed;inset:0;background:#075e54;color:#fff;z-index:6000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.incoming-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#fff;margin:20px}
.incoming-buttons{display:flex;gap:30px;margin-top:30px}
.incoming-buttons button{width:65px;height:65px;border-radius:50%;font-size:25px}
.typing{font-size:12px;color:#ddd}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:8px;z-index:9000}
.range{width:180px!important;padding:0!important}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="title">Dost Chat</div>
<button onclick="toggleMenu()">⋮</button>
</div>

<div class="lang">
<button onclick="setLanguage('ur')">🇵🇰 اردو</button>
<button onclick="setLanguage('en')">🇬🇧 English</button>
</div>

<div id="menu" class="menu hidden">
<button onclick="newGroup()">👥 New Group</button>
<button onclick="newCommunity()">👨‍👩‍👧 New Community</button>
<button onclick="broadcast()">📢 Broadcast Lists</button>
<button onclick="linkDevices()">🔗 Link Devices</button>
<button onclick="starred()">⭐ Starred</button>
<button onclick="readAll()">✓ Read All</button>
<button onclick="openSettings()">⚙️ Settings</button>
<button onclick="openProfile()">👤 Profile</button>
<button onclick="logout()">🚪 Logout</button>
</div>

<section id="loginPage">

<div class="box">

<h2 id="welcome">خوش آمدید</h2>

<input id="name" placeholder="نام">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<label>
<input id="remember" type="checkbox" style="width:auto" checked>
<span id="rememberText">مجھے یاد رکھیں</span>
</label>

<button class="full" onclick="register()">نیا اکاؤنٹ بنائیں</button>
<button class="full blue" onclick="login()">لاگ اِن</button>

</div>
</section>

<section id="homePage" class="hidden">

<div class="box">

<div id="profile"></div>

<div class="search">
<input id="search" placeholder="Email">
<button onclick="findUser()">تلاش</button>
</div>

<div id="result"></div>

<h3 id="usersTitle">صارفین</h3>
<div id="users"></div>

</div>
</section>

<section id="chatPage" class="hidden">

<div class="chat-head">

<button onclick="backHome()">←</button>

<img id="chatAvatar" class="chat-avatar">

<div class="chat-info">
<strong id="chatName"></strong>
<div id="chatStatus" class="status"></div>
<div id="typing" class="typing"></div>
</div>

<div class="chat-actions">
<button onclick="startVoice()">🎤</button>
<button onclick="startVideo()">📹</button>
</div>

</div>

<div id="messages" class="messages"></div>

<div class="send">
<input id="message" placeholder="پیغام لکھیں...">
<button onclick="sendMessage()">بھیجیں</button>
</div>

</section>

<section id="settingsPage" class="hidden">

<div class="page-head">
<button onclick="backHome()">←</button>
<strong>Settings</strong>
</div>

<div class="option">👤 Account</div>
<div class="option">🔒 Privacy</div>
<div class="option">📋 Lists</div>
<div class="option">💬 Chats</div>
<div class="option">🔔 Notifications</div>
<div class="option">🎨 Theme</div>
<div class="option">🌐 Language</div>
<div class="option">❓ Help</div>
<div class="option">ℹ️ About</div>

</section>

<section id="profilePage" class="hidden">

<div class="page-head">
<button onclick="backHome()">←</button>
<strong>Profile</strong>
</div>

<div class="box">

<img id="profileLarge" class="profile-large">

<input id="profileName" placeholder="Name">

<input id="profileFile" type="file" accept="image/*">

<button class="full" onclick="saveProfile()">Save Profile</button>

</div>
</section>

<div id="groupModal" class="modal hidden">

<div class="modal-box">

<h2>New Group</h2>

<input id="groupName" placeholder="Group Name">

<div id="groupUsers"></div>

<button class="full" onclick="createGroup()">Create Group</button>
<button class="full red" onclick="closeGroup()">Cancel</button>

</div>
</div>

<div id="incomingCall" class="incoming hidden">

<img id="incomingAvatar" class="incoming-avatar">

<h2 id="incomingType">Incoming Call</h2>
<h2 id="incomingName"></h2>

<div class="incoming-buttons">
<button class="red" onclick="rejectIncoming()">✕</button>
<button onclick="acceptIncoming()">✓</button>
</div>

</div>

<div id="callScreen" class="call-screen hidden">

<div class="call-top">
<strong id="callTitle">Call</strong>
<div id="callStatus">Connecting...</div>
</div>

<div class="videos">

<video id="remoteVideo" autoplay playsinline></video>
<video id="localVideo" autoplay muted playsinline></video>

</div>

<div class="call-buttons">

<button id="micBtn" onclick="toggleMic()">🎤</button>
<button onclick="toggleSpeaker()">🔊</button>
<button onclick="toggleCamera()">📹</button>
<button onclick="switchCamera()">🔄</button>
<button class="red" onclick="endCall()">📞</button>

</div>

<div style="text-align:center;padding-bottom:10px">

🔊
<input id="volumeControl" class="range"
type="range" min="0" max="1" step="0.05"
value="1" oninput="setVolume(this.value)">

</div>

</div>

<audio id="ringtone" loop preload="auto">
<source src="ringtone.mp3" type="audio/mpeg">
</audio>

<div id="toast" class="toast hidden"></div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
setPersistence,
browserLocalPersistence,
browserSessionPersistence,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
getDocs,
addDoc,
query,
where,
orderBy,
onSnapshot,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
getDatabase,
ref,
set,
onValue,
onDisconnect,
remove,
serverTimestamp as dbTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


const firebaseConfig={

apiKey:"AIzaSyBvEGBT5yvkcPoziNc3U9rh87IEkOn_7eM",

authDomain:"dost-chat-a7eec.firebaseapp.com",

projectId:"dost-chat-a7eec",

messagingSenderId:"760944205758",

appId:"1:760944205758:web:41d06ed0c34b3f24f8a3ef",

databaseURL:"https://dost-chat-a7eec-default-rtdb.firebaseio.com/"

};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);
const db=getFirestore(app);
const rtdb=getDatabase(app);


let currentUser=null;
let selectedUser=null;

let chatUnsub=null;
let typingTimer=null;

let pc=null;
let localStream=null;

let currentCallId=null;
let incomingCallData=null;

let callDocUnsub=null;
let candidateUnsubs=[];

let pendingCandidates=[];
let remoteDescriptionSet=false;

let isVideoCall=false;
let callEnded=false;

const ringtone=document.getElementById("ringtone");

const rtcConfig={
iceServers:[
{urls:"stun:stun.l.google.com:19302"},
{urls:"stun:stun1.l.google.com:19302"}
]
};


/* LANGUAGE */

let lang=localStorage.getItem("dostLanguage")||"ur";

window.setLanguage=function(x){

lang=x;

localStorage.setItem("dostLanguage",x);

document.documentElement.dir=x==="ur"?"rtl":"ltr";

document.getElementById("welcome").textContent=
x==="ur"?"خوش آمدید":"Welcome";

document.getElementById("rememberText").textContent=
x==="ur"?"مجھے یاد رکھیں":"Remember Me";

document.getElementById("usersTitle").textContent=
x==="ur"?"صارفین":"Users";

};

window.setLanguage(lang);


/* HELPERS */

function show(id){
document.getElementById(id).classList.remove("hidden");
}

function hide(id){
document.getElementById(id).classList.add("hidden");
}

function toast(msg){

const t=document.getElementById("toast");

t.textContent=msg;
t.classList.remove("hidden");

setTimeout(()=>t.classList.add("hidden"),3000);

}

function safe(value){

const div=document.createElement("div");
div.textContent=value||"";
return div.innerHTML;

}


/* RING */

function startRingtone(){

try{
ringtone.currentTime=0;
const p=ringtone.play();
if(p)p.catch(()=>{});
}catch(e){}

}

function stopRingtone(){

try{
ringtone.pause();
ringtone.currentTime=0;
}catch(e){}

}


/* MENU */

window.toggleMenu=function(){
document.getElementById("menu").classList.toggle("hidden");
};


/* REGISTER */

window.register=async function(){

const name=document.getElementById("name").value.trim();
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!name||!email||!password){
toast("تمام معلومات درج کریں");
return;
}

if(password.length<6){
toast("Password کم از کم 6 characters");
return;
}

try{

await setPersistence(
auth,
document.getElementById("remember").checked
?browserLocalPersistence
:browserSessionPersistence
);

const result=await createUserWithEmailAndPassword(
auth,email,password
);

await setDoc(
doc(db,"users",result.user.uid),
{
uid:result.user.uid,
name,
email,
photoURL:"",
createdAt:serverTimestamp()
}
);

toast("Account بن گیا");

}catch(e){
toast(e.message);
}

};


/* LOGIN */

window.login=async function(){

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email||!password){
toast("Email اور Password درج کریں");
return;
}

try{

await setPersistence(
auth,
document.getElementById("remember").checked
?browserLocalPersistence
:browserSessionPersistence
);

await signInWithEmailAndPassword(auth,email,password);

}catch(e){
toast(e.message);
}

};


/* AUTH */

onAuthStateChanged(auth,async user=>{

if(!user){

currentUser=null;

hide("homePage");
hide("chatPage");
hide("settingsPage");
hide("profilePage");
hide("callScreen");
hide("incomingCall");

show("loginPage");

return;

}

currentUser=user;

hide("loginPage");
show("homePage");

await setupPresence();

loadProfile();
loadUsers();
listenIncomingCalls();

});


/* PRESENCE */

async function setupPresence(){

const statusRef=ref(
rtdb,
"status/"+currentUser.uid
);

const connectedRef=ref(rtdb,".info/connected");

onValue(connectedRef,snap=>{

if(snap.val()!==true)return;

onDisconnect(statusRef).set({
state:"offline",
lastChanged:dbTimestamp()
});

set(statusRef,{
state:"online",
lastChanged:dbTimestamp()
});

});

}


/* PROFILE */

async function loadProfile(){

const snap=await getDoc(
doc(db,"users",currentUser.uid)
);

if(!snap.exists())return;

const d=snap.data();

document.getElementById("profile").innerHTML=`
<div class="profile">
<img class="avatar" src="${d.photoURL||""}">
<div>
<strong>${safe(d.name)}</strong><br>
<small>${safe(d.email)}</small>
</div>
</div>
`;

}


window.openProfile=async function(){

hide("menu");
hide("homePage");
hide("chatPage");
hide("settingsPage");

show("profilePage");

const snap=await getDoc(
doc(db,"users",currentUser.uid)
);

if(!snap.exists())return;

const d=snap.data();

document.getElementById("profileLarge").src=d.photoURL||"";
document.getElementById("profileName").value=d.name||"";

};


/* PROFILE PHOTO WITHOUT STORAGE */

window.saveProfile=async function(){

const name=document.getElementById("profileName").value.trim();

const file=document.getElementById("profileFile").files[0];

let photoURL="";

try{

const old=await getDoc(
doc(db,"users",currentUser.uid)
);

if(old.exists()){
photoURL=old.data().photoURL||"";
}

if(file){

if(file.size>2*1024*1024){

toast("تصویر 2MB سے کم رکھیں");
return;

}

photoURL=await fileToBase64(file);

}

await setDoc(
doc(db,"users",currentUser.uid),
{
name:name||"User",
photoURL:photoURL
},
{merge:true}
);

document.getElementById("profileLarge").src=photoURL;

await loadProfile();

toast("Profile محفوظ ہوگئی");

}catch(e){

toast(e.message);

}

};


function fileToBase64(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=()=>resolve(reader.result);
reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* USERS */

function loadUsers(){

onSnapshot(collection(db,"users"),snap=>{

const box=document.getElementById("users");

box.innerHTML="";

snap.forEach(s=>{

if(s.id===currentUser.uid)return;

const d=s.data();

const div=document.createElement("div");

div.className="user";

div.innerHTML=`
<img src="${d.photoURL||""}">
<div>
<strong>${safe(d.name||"User")}</strong>
<div>${safe(d.email||"")}</div>
<div id="status-${s.id}" class="status">...</div>
</div>
`;

div.onclick=()=>openChat({
uid:s.id,
name:d.name||"User",
email:d.email||"",
photoURL:d.photoURL||""
});

box.appendChild(div);

listenStatus(s.id);

});

});

}


/* STATUS */

function listenStatus(uid){

onValue(
ref(rtdb,"status/"+uid),
snap=>{

const el=document.getElementById("status-"+uid);

if(!el)return;

const d=snap.val();

if(d?.state==="online"){

el.textContent=lang==="ur"
?"🟢 آن لائن"
:"🟢 Online";

}else if(d?.lastChanged){

el.textContent=(lang==="ur"
?"آخری بار: "
:"Last seen: ")+
new Date(d.lastChanged).toLocaleString();

}else{

el.textContent=
lang==="ur"?"آف لائن":"Offline";

}

});

}


/* SEARCH */

window.findUser=async function(){

const email=document.getElementById("search").value.trim();

if(!email)return;

const q=query(
collection(db,"users"),
where("email","==",email)
);

const snap=await getDocs(q);

const result=document.getElementById("result");

result.innerHTML="";

if(snap.empty){

result.textContent="User نہیں ملا";
return;

}

const s=snap.docs[0];
const d=s.data();

const div=document.createElement("div");

div.className="user";

div.innerHTML=`
<img src="${d.photoURL||""}">
<div>
<strong>${safe(d.name)}</strong>
<div>${safe(d.email)}</div>
</div>
`;

div.onclick=()=>openChat({
uid:s.id,
name:d.name,
email:d.email,
photoURL:d.photoURL||""
});

result.appendChild(div);

};


/* CHAT */

function chatId(){

return [
currentUser.uid,
selectedUser.uid
].sort().join("_");

}


function openChat(user){

selectedUser=user;

hide("homePage");
show("chatPage");

document.getElementById("chatName").textContent=user.name;
document.getElementById("chatAvatar").src=user.photoURL||"";

listenChatStatus();
listenMessages();
listenTyping();

}


function listenChatStatus(){

onValue(
ref(rtdb,"status/"+selectedUser.uid),
snap=>{

const d=snap.val();
const el=document.getElementById("chatStatus");

if(d?.state==="online"){

el.textContent=lang==="ur"
?"🟢 آن لائن":"🟢 Online";

}else if(d?.lastChanged){

el.textContent=(lang==="ur"
?"آخری بار: "
:"Last seen: ")+
new Date(d.lastChanged).toLocaleString();

}

});

}


function listenMessages(){

if(chatUnsub)chatUnsub();

const q=query(
collection(db,"chats",chatId(),"messages"),
orderBy("createdAt","asc")
);

chatUnsub=onSnapshot(q,snap=>{

const box=document.getElementById("messages");

box.innerHTML="";

snap.forEach(s=>{

const d=s.data();

const div=document.createElement("div");

div.className="msg "+
(d.senderId===currentUser.uid?"mine":"theirs");

div.textContent=d.text;

box.appendChild(div);

});

box.scrollTop=box.scrollHeight;

});

}


window.sendMessage=async function(){

const input=document.getElementById("message");

const text=input.value.trim();

if(!text||!selectedUser)return;

await addDoc(
collection(db,"chats",chatId(),"messages"),
{
text,
senderId:currentUser.uid,
receiverId:selectedUser.uid,
createdAt:serverTimestamp()
}
);

input.value="";

};


document.getElementById("message").addEventListener(
"input",
()=>{

if(!selectedUser)return;

const typingRef=ref(
rtdb,
"typing/"+chatId()+"/"+currentUser.uid
);

set(typingRef,true);

clearTimeout(typingTimer);

typingTimer=setTimeout(
()=>remove(typingRef),
1200
);

});


function listenTyping(){

onValue(
ref(
rtdb,
"typing/"+chatId()+"/"+selectedUser.uid
),
snap=>{
document.getElementById("typing").textContent=
snap.val()?"typing...":"";
});

}


window.backHome=function(){

if(chatUnsub)chatUnsub();

hide("chatPage");
hide("settingsPage");
hide("profilePage");

show("homePage");

};


/* GROUP */

window.newGroup=function(){

hide("menu");
show("groupModal");
loadGroupUsers();

};


async function loadGroupUsers(){

const box=document.getElementById("groupUsers");

box.innerHTML="";

const snap=await getDocs(collection(db,"users"));

snap.forEach(s=>{

if(s.id===currentUser.uid)return;

const d=s.data();

box.innerHTML+=`
<label style="display:block;padding:8px">
<input type="checkbox"
class="groupMember"
value="${s.id}"
style="width:auto">
${safe(d.name)}
</label>
`;

});

}


window.createGroup=async function(){

const name=document.getElementById("groupName").value.trim();

const members=[currentUser.uid];

document.querySelectorAll(".groupMember:checked")
.forEach(x=>members.push(x.value));

if(!name){
toast("Group name لکھیں");
return;
}

await addDoc(
collection(db,"groups"),
{
name,
members,
createdBy:currentUser.uid,
createdAt:serverTimestamp()
}
);

closeGroup();
toast("Group created");

};


window.closeGroup=function(){
hide("groupModal");
};


/* SETTINGS */

window.openSettings=function(){

hide("menu");
hide("homePage");
hide("chatPage");
hide("profilePage");

show("settingsPage");

};

window.newCommunity=function(){
hide("menu");
toast("Community feature");
};

window.broadcast=function(){
hide("menu");
toast("Broadcast Lists");
};

window.linkDevices=function(){
hide("menu");
toast("Link Devices");
};

window.starred=function(){
hide("menu");
toast("Starred Messages");
};

window.readAll=function(){
hide("menu");
toast("All messages read");
};


/* =====================================================
   REAL WEBRTC CALLING
===================================================== */

window.startVoice=function(){
startOutgoingCall(false);
};

window.startVideo=function(){
startOutgoingCall(true);
};


/* CREATE PEER */

function createPeer(){

pc=new RTCPeerConnection(rtcConfig);

pc.ontrack=event=>{

const remote=document.getElementById("remoteVideo");

if(event.streams && event.streams[0]){

remote.srcObject=event.streams[0];

remote.play().catch(()=>{});

}

document.getElementById("callStatus").textContent="Connected";

};

pc.onconnectionstatechange=()=>{

if(!pc)return;

const state=pc.connectionState;

if(state==="connected"){

document.getElementById("callStatus").textContent="Connected";

}

if(state==="failed"){

document.getElementById("callStatus").textContent="Connection failed";

}

if(state==="disconnected"){

document.getElementById("callStatus").textContent="Disconnected";

}

};

pc.onicecandidate=async event=>{

if(!event.candidate||!currentCallId)return;

const path=
currentUser.uid===
(await getCallerId(currentCallId))
?"callerCandidates"
:"calleeCandidates";

try{

await addDoc(
collection(db,"calls",currentCallId,path),
event.candidate.toJSON()
);

}catch(e){

console.log("ICE error",e);

}

};

return pc;

}


/* GET CALLER ID */

async function getCallerId(callId){

const snap=await getDoc(
doc(db,"calls",callId)
);

return snap.exists()?snap.data().callerId:null;

}


/* ADD CANDIDATE SAFELY */

async function addRemoteCandidate(candidate){

if(!pc||!candidate)return;

if(!remoteDescriptionSet){

pendingCandidates.push(candidate);
return;

}

try{

await pc.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){

console.log("candidate",e);

}

}


async function flushCandidates(){

if(!pc||!remoteDescriptionSet)return;

for(const candidate of pendingCandidates){

try{

await pc.addIceCandidate(
new RTCIceCandidate(candidate)
);

}catch(e){}

}

pendingCandidates=[];

}


/* LISTEN CANDIDATES */

function listenCandidates(path){

const unsub=onSnapshot(
collection(db,"calls",currentCallId,path),
snap=>{

snap.docChanges().forEach(change=>{

if(change.type==="added"){

addRemoteCandidate(change.doc.data());

}

});

});

candidateUnsubs.push(unsub);

}


/* OUTGOING */

async function startOutgoingCall(video){

if(!selectedUser)return;

if(currentCallId)return;

isVideoCall=video;
callEnded=false;
remoteDescriptionSet=false;
pendingCandidates=[];

currentCallId=crypto.randomUUID();

show("callScreen");

document.getElementById("callTitle").textContent=
video?"📹 Video Call":"🎤 Voice Call";

document.getElementById("callStatus").textContent=
"Calling "+selectedUser.name;

try{

localStream=
await navigator.mediaDevices.getUserMedia({
audio:true,
video:video
});

}catch(e){

toast("Microphone/Camera permission دیں");

currentCallId=null;
hide("callScreen");

return;

}

const localVideo=document.getElementById("localVideo");

localVideo.srcObject=localStream;

localVideo.style.display=video?"block":"none";

createPeer();

localStream.getTracks().forEach(track=>{
pc.addTrack(track,localStream);
});

const callerPhoto=await getUserPhoto(currentUser.uid);
const callerName=await getUserName(currentUser.uid);

const callRef=doc(db,"calls",currentCallId);

await setDoc(callRef,{
callerId:currentUser.uid,
callerName,
callerPhoto,
receiverId:selectedUser.uid,
receiverName:selectedUser.name,
receiverPhoto:selectedUser.photoURL||"",
video,
status:"ringing",
createdAt:serverTimestamp()
});

listenCallDocument();

listenCandidates("calleeCandidates");

const offer=await pc.createOffer();

await pc.setLocalDescription(offer);

await setDoc(
callRef,
{
offer:{
type:offer.type,
sdp:offer.sdp
}
},
{merge:true}
);

}


/* INCOMING */

let incomingUnsub=null;

function listenIncomingCalls(){

if(incomingUnsub)incomingUnsub();

const q=query(
collection(db,"calls"),
where("receiverId","==",currentUser.uid),
where("status","==","ringing")
);

incomingUnsub=onSnapshot(q,snap=>{

snap.docChanges().forEach(change=>{

if(change.type!=="added")return;

const d=change.doc.data();

if(d.callerId===currentUser.uid)return;

incomingCallData={
id:change.doc.id,
...d
};

document.getElementById("incomingAvatar").src=
d.callerPhoto||"";

document.getElementById("incomingName").textContent=
d.callerName||"Unknown";

document.getElementById("incomingType").textContent=
d.video
?"📹 Incoming Video Call"
:"🎤 Incoming Voice Call";

show("incomingCall");

startRingtone();

});

});

}


/* ACCEPT */

window.acceptIncoming=async function(){

if(!incomingCallData)return;

const call={...incomingCallData};

stopRingtone();

hide("incomingCall");

selectedUser={
uid:call.callerId,
name:call.callerName,
photoURL:call.callerPhoto||""
};

currentCallId=call.id;

isVideoCall=!!call.video;
callEnded=false;
remoteDescriptionSet=false;
pendingCandidates=[];

show("callScreen");

document.getElementById("callTitle").textContent=
call.video?"📹 Video Call":"🎤 Voice Call";

document.getElementById("callStatus").textContent="Connecting...";

try{

localStream=
await navigator.mediaDevices.getUserMedia({
audio:true,
video:call.video
});

}catch(e){

toast("Microphone/Camera permission دیں");

await setDoc(
doc(db,"calls",currentCallId),
{status:"rejected"},
{merge:true}
);

currentCallId=null;

return;

}

document.getElementById("localVideo").srcObject=localStream;

document.getElementById("localVideo").style.display=
call.video?"block":"none";

createPeer();

localStream.getTracks().forEach(track=>{
pc.addTrack(track,localStream);
});

const callRef=doc(db,"calls",currentCallId);

const snap=await getDoc(callRef);

if(!snap.exists()){

toast("Call not found");
cleanupCall(false);
return;

}

const data=snap.data();

if(!data.offer){

toast("Offer نہیں ملی");
cleanupCall(false);
return;

}

await pc.setRemoteDescription(
new RTCSessionDescription(data.offer)
);

remoteDescriptionSet=true;

await flushCandidates();

const answer=await pc.createAnswer();

await pc.setLocalDescription(answer);

await setDoc(
callRef,
{
answer:{
type:answer.type,
sdp:answer.sdp
},
status:"connected"
},
{merge:true}
);

listenCallDocument();

listenCandidates("callerCandidates");

};


/* CALL DOCUMENT */

function listenCallDocument(){

if(callDocUnsub)callDocUnsub();

callDocUnsub=onSnapshot(
doc(db,"calls",currentCallId),
async snap=>{

const d=snap.data();

if(!d)return;

if(d.answer&&pc&&currentUser.uid===d.receiverId===false){

try{

if(!remoteDescriptionSet){

await pc.setRemoteDescription(
new RTCSessionDescription(d.answer)
);

remoteDescriptionSet=true;

await flushCandidates();

document.getElementById("callStatus").textContent="Connected";

}

}catch(e){

console.log("answer error",e);

}

}

if(d.answer&&pc&&d.callerId===currentUser.uid){

try{

if(!remoteDescriptionSet){

await pc.setRemoteDescription(
new RTCSessionDescription(d.answer)
);

remoteDescriptionSet=true;

await flushCandidates();

document.getElementById("callStatus").textContent="Connected";

}

}catch(e){

console.log(e);

}

}

if(d.status==="rejected"){

stopRingtone();
toast("Call rejected");
cleanupCall(false);

}

if(d.status==="ended"){

stopRingtone();
toast("Call ended");
cleanupCall(false);

}

});

}


/* REJECT */

window.rejectIncoming=async function(){

stopRingtone();

if(!incomingCallData)return;

try{

await setDoc(
doc(db,"calls",incomingCallData.id),
{
status:"rejected",
endedBy:currentUser.uid,
endedAt:serverTimestamp()
},
{merge:true}
);

}catch(e){}

hide("incomingCall");

incomingCallData=null;

};


/* END */

window.endCall=async function(writeEnd=true){

const callId=currentCallId;

if(writeEnd&&callId){

try{

await setDoc(
doc(db,"calls",callId),
{
status:"ended",
endedBy:currentUser.uid,
endedAt:serverTimestamp()
},
{merge:true}
);

}catch(e){}

}

cleanupCall(false);

};


function cleanupCall(){

stopRingtone();

callEnded=true;

if(localStream){

localStream.getTracks().forEach(track=>{
try{track.stop()}catch(e){}
});

localStream=null;

}

if(pc){

try{pc.close()}catch(e){}

pc=null;

}

if(callDocUnsub){

callDocUnsub();
callDocUnsub=null;

}

candidateUnsubs.forEach(unsub=>{
try{unsub()}catch(e){}
});

candidateUnsubs=[];

pendingCandidates=[];
remoteDescriptionSet=false;

document.getElementById("localVideo").srcObject=null;
document.getElementById("remoteVideo").srcObject=null;

document.getElementById("localVideo").style.display="block";

currentCallId=null;
incomingCallData=null;

hide("callScreen");
hide("incomingCall");

}


/* MIC */

window.toggleMic=function(){

if(!localStream)return;

const tracks=localStream.getAudioTracks();

tracks.forEach(track=>{
track.enabled=!track.enabled;
});

document.getElementById("micBtn").textContent=
tracks[0]?.enabled?"🎤":"🔇";

};


/* CAMERA */

window.toggleCamera=function(){

if(!localStream)return;

const tracks=localStream.getVideoTracks();

if(!tracks.length)return;

tracks.forEach(track=>{
track.enabled=!track.enabled;
});

};


/* SWITCH CAMERA */

window.switchCamera=async function(){

if(!localStream)return;

const oldTrack=localStream.getVideoTracks()[0];

if(!oldTrack)return;

const facing=oldTrack.getSettings().facingMode;

const newFacing=
facing==="environment"?"user":"environment";

try{

const newStream=
await navigator.mediaDevices.getUserMedia({
video:{facingMode:newFacing},
audio:false
});

const newTrack=newStream.getVideoTracks()[0];

const sender=pc?.getSenders().find(
s=>s.track?.kind==="video"
);

if(sender){

await sender.replaceTrack(newTrack);

}

oldTrack.stop();

const audioTracks=localStream.getAudioTracks();

localStream=new MediaStream([
...audioTracks,
newTrack
]);

document.getElementById("localVideo").srcObject=localStream;

}catch(e){

toast("Camera switch نہیں ہو سکا");

}

};


/* VOLUME */

window.setVolume=function(value){

document.getElementById("remoteVideo").volume=
Number(value);

};

window.toggleSpeaker=function(){

const remote=document.getElementById("remoteVideo");

remote.muted=!remote.muted;

toast(remote.muted?"Speaker off":"Speaker on");

};


/* USER */

async function getUserName(uid){

const snap=await getDoc(
doc(db,"users",uid)
);

return snap.exists()
?(snap.data().name||"User")
:"User";

}


async function getUserPhoto(uid){

const snap=await getDoc(
doc(db,"users",uid)
);

return snap.exists()
?(snap.data().photoURL||"")
:"";

}


/* LOGOUT */

window.logout=async function(){

if(currentCallId){

await endCall(true);

}

await signOut(auth);

};

</script>
